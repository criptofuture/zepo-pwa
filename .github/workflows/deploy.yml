name: Deploy — PWA + Supabase Functions

on:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

jobs:
  regression-check:
    name: Regression Guard (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical CSS values (v46+ architecture)
        run: |
          FAIL=0
          grep -A5 '\.tab-bar {' index.html | grep -q 'height: var(--tab-total)' || { echo "❌ tab-bar height must be var(--tab-total)"; FAIL=1; }
          grep -A8 '\.main-content {' index.html | grep -q 'padding-bottom: var(--content-pad-bottom)' || { echo "❌ main-content must use var(--content-pad-bottom)"; FAIL=1; }
          grep -A5 '\.fab {' index.html | grep -q 'bottom: var(--fab-bottom)' || { echo "❌ FAB must use var(--fab-bottom)"; FAIL=1; }
          grep -A5 '\.approve-header {' index.html | grep -q 'var(--overlay-pad-top)' || { echo "❌ approve-header must use var(--overlay-pad-top)"; FAIL=1; }
          grep -q 'x-show="!editingBatch" :style="' index.html && { echo "❌ toggle uses :style (breaks x-show flex)"; FAIL=1; }
          grep -q 'var(--card)' index.html && { echo "❌ var(--card) found — does NOT exist"; FAIL=1; }
          grep -A5 'split-picker-avatar' index.html | grep -q 'color: #000' && { echo "❌ avatar color:#000 invisible"; FAIL=1; }
          [ $FAIL -eq 1 ] && echo "🚨 BLOCKED — regression detected" && exit 1
          echo "✅ All checks passed"

      - name: Check commit has verification tag
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qi "VERIFIED:"; then
            echo "✅ Commit includes verification tag"
          else
            echo "⚠️ WARNING: commit missing VERIFIED: tag (visual check may not have been done)"
            echo "Future versions will block deploys without this tag."
          fi

  deploy-pwa:
    name: Deploy PWA → app.zepo.lynoia.com
    needs: regression-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp manifest.json _deploy/
          cp sw.js _deploy/
          cp -r icons _deploy/
          # CF Pages requires _redirects and _headers in the deployed folder.
          # Without them, /pwa/* rewrites stop being served and Cache-Control
          # falls back to CF Pages' 7-day default at the edge — sw.js updates
          # stay cached even after a successful deploy.
          [ -f _redirects ] && cp _redirects _deploy/
          [ -f _headers ] && cp _headers _deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=zepo --branch=main --commit-dirty=true

  deploy-functions:
    name: Deploy Edge Functions → Supabase
    runs-on: ubuntu-latest
    # Solo si hay cambios en supabase/ (modified o added) o manual
    if: |
      contains(join(github.event.head_commit.modified, ','), 'supabase/') ||
      contains(join(github.event.head_commit.added, ','), 'supabase/') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy save-push-sub \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-daily-push \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-weekly-email \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy find-user \
            --project-ref vchaxqisbypwwtyjjnjr
          supabase functions deploy parse-bank-statement \
            --project-ref vchaxqisbypwwtyjjnjr

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          supabase secrets set \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_PUBLIC_KEY=BFarnYqUAFW5QEds5F0JQoL4BBpkApdV0hi9unggIHSky4wLmOJgEpIQEGVbHIJ36pL0kvv14mOlYD8orYzqXAM \
            VAPID_EMAIL=hola@zepo.app \
            RESEND_API_KEY="$RESEND_API_KEY" \
            FROM_EMAIL="Zepo <hola@zepo.lynoia.com>" \
            WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --project-ref vchaxqisbypwwtyjjnjr
