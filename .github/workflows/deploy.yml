name: Deploy — PWA + Supabase Functions

on:
  push:
    branches: [master, main, dev]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'sw-kamikaze.js'
      - 'reset.html'
      - 'icons/**'
      - 'vendor/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

jobs:
  regression-check:
    name: Regression Guard (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check critical CSS values (v46+ architecture)
        run: |
          FAIL=0
          grep -A5 '\.tab-bar {' index.html | grep -q 'height: var(--tab-total)' || { echo "❌ tab-bar height must be var(--tab-total)"; FAIL=1; }
          grep -A8 '\.main-content {' index.html | grep -q 'padding-bottom: var(--content-pad-bottom)' || { echo "❌ main-content must use var(--content-pad-bottom)"; FAIL=1; }
          grep -A5 '\.fab {' index.html | grep -q 'bottom: var(--fab-bottom)' || { echo "❌ FAB must use var(--fab-bottom)"; FAIL=1; }
          grep -A5 '\.approve-header {' index.html | grep -q 'var(--overlay-pad-top)' || { echo "❌ approve-header must use var(--overlay-pad-top)"; FAIL=1; }
          grep -q 'x-show="!editingBatch" :style="' index.html && { echo "❌ toggle uses :style (breaks x-show flex)"; FAIL=1; }
          grep -q 'var(--card)' index.html && { echo "❌ var(--card) found — does NOT exist"; FAIL=1; }
          grep -A5 'split-picker-avatar' index.html | grep -q 'color: #000' && { echo "❌ avatar color:#000 invisible"; FAIL=1; }
          [ $FAIL -eq 1 ] && echo "🚨 BLOCKED — regression detected" && exit 1
          echo "✅ All checks passed"

      - name: Brand guardrail (lint-design.py · editorial V2.0)
        run: python3 tools/lint-design.py index.html

      - name: Check commit has verification tag
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qi "VERIFIED:"; then
            echo "✅ Commit includes verification tag"
          else
            echo "⚠️ WARNING: commit missing VERIFIED: tag (visual check may not have been done)"
            echo "Future versions will block deploys without this tag."
          fi

  deploy-pwa:
    name: Deploy PWA (prod main / preview dev)
    needs: regression-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy folder (physical /pwa/ structure)
        run: |
          # CRITICAL: files must live PHYSICALLY under /pwa/ — not via _redirects rewrites.
          # CF Pages only applies _headers to real file paths; rewritten paths get CF's
          # 7-day edge cache default, which traps sw.js/HTML updates. See playbook.
          mkdir -p _deploy/pwa/icons
          cp index.html _deploy/pwa/index.html
          cp manifest.json _deploy/pwa/manifest.json
          # SW served under a cache-busting filename (sw-v65.js) — index.html registers this.
          # New filename each bump forces CF edge MISS (CF caches old names 7 days).
          cp sw.js _deploy/pwa/sw-v104.js
          # kamikaze sw.js at the legacy path auto-unregisters old SWs on update check.
          [ -f sw-kamikaze.js ] && cp sw-kamikaze.js _deploy/pwa/sw.js
          # vendored libs (driver.js para el tour del primer gasto A7)
          [ -d vendor ] && cp -r vendor _deploy/pwa/vendor
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch.png icons/favicon-32.png icons/og.png _deploy/pwa/icons/ 2>/dev/null || true
          [ -f icons/icon.svg ] && cp icons/icon.svg _deploy/pwa/icons/
          [ -f icons/icon-dev-192.png ] && cp icons/icon-dev-192.png _deploy/pwa/icons/
          [ -f icons/icon-dev-512.png ] && cp icons/icon-dev-512.png _deploy/pwa/icons/
          # reset.html at root (outside SW scope) — lets stuck users clear old SW + cache.
          # Copied to BOTH root and /pwa/ so neither URL guess 404s (CF strips .html → /reset, /pwa/reset).
          [ -f reset.html ] && cp reset.html _deploy/reset.html && cp reset.html _deploy/pwa/reset.html
          # Generate _headers — applies to physical /pwa/ paths.
          cat > _deploy/_headers <<'HEADERS'
          /pwa/sw-v104.js
            Cache-Control: no-cache, no-store, must-revalidate
            Service-Worker-Allowed: /
          /pwa/sw.js
            Cache-Control: no-cache, no-store, must-revalidate
            Service-Worker-Allowed: /
          /pwa/index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /pwa/
            Cache-Control: no-cache, no-store, must-revalidate
          /pwa/manifest.json
            Cache-Control: no-cache, no-store, must-revalidate
          /reset.html
            Cache-Control: no-cache, no-store, must-revalidate
          /pwa/reset.html
            Cache-Control: no-cache, no-store, must-revalidate
          /pwa/icons/*
            Cache-Control: public, max-age=3600
          HEADERS
          # Generate _redirects — only root → /pwa/, no rewrites.
          printf '/ /pwa/ 302\n' > _deploy/_redirects
          echo "=== _deploy tree ==="; find _deploy -type f | sort

      - name: Resolve CF Pages branch (master/main → main = prod · dev → dev = preview)
        id: cfbranch
        run: echo "name=${{ (github.ref_name == 'master' || github.ref_name == 'main') && 'main' || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=zepo --branch=${{ steps.cfbranch.outputs.name }} --commit-dirty=true

      - name: Print target URL
        run: |
          if [ "${{ steps.cfbranch.outputs.name }}" = "main" ]; then
            echo "🌐 PROD → https://app.zepo.lynoia.com/pwa/"
          else
            echo "🔎 PREVIEW (${{ steps.cfbranch.outputs.name }}) → https://${{ steps.cfbranch.outputs.name }}.zepo-bca.pages.dev/pwa/"
          fi

  deploy-functions:
    name: Deploy Edge Functions → Supabase
    runs-on: ubuntu-latest
    # Solo si hay cambios en supabase/ (modified o added) o manual
    if: |
      contains(join(github.event.head_commit.modified, ','), 'supabase/') ||
      contains(join(github.event.head_commit.added, ','), 'supabase/') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy save-push-sub \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-daily-push \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-weekly-email \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy find-user \
            --project-ref vchaxqisbypwwtyjjnjr
          supabase functions deploy parse-bank-statement \
            --project-ref vchaxqisbypwwtyjjnjr

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          supabase secrets set \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_PUBLIC_KEY=BFarnYqUAFW5QEds5F0JQoL4BBpkApdV0hi9unggIHSky4wLmOJgEpIQEGVbHIJ36pL0kvv14mOlYD8orYzqXAM \
            VAPID_EMAIL=hola@zepo.app \
            RESEND_API_KEY="$RESEND_API_KEY" \
            FROM_EMAIL="Zepo <hola@zepo.lynoia.com>" \
            WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --project-ref vchaxqisbypwwtyjjnjr
