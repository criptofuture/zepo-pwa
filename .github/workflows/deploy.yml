name: Deploy — PWA + Supabase Functions

on:
  push:
    branches: [master, main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

jobs:
  deploy-pwa:
    name: Deploy PWA → app.zepo.lynoia.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp manifest.json _deploy/
          cp sw.js _deploy/
          cp -r icons _deploy/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=zepo --branch=main --commit-dirty=true

  deploy-functions:
    name: Deploy Edge Functions → Supabase
    runs-on: ubuntu-latest
    # Solo si hay cambios en supabase/ (modified o added) o manual
    if: |
      contains(join(github.event.head_commit.modified, ','), 'supabase/') ||
      contains(join(github.event.head_commit.added, ','), 'supabase/') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy save-push-sub \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-daily-push \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt
          supabase functions deploy send-weekly-email \
            --project-ref vchaxqisbypwwtyjjnjr \
            --no-verify-jwt

      - name: Set Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          supabase secrets set \
            VAPID_PRIVATE_KEY=xb579mNED3fUmBGPIeA2FUlXIi6yBpTI24ZpLrx3890 \
            VAPID_PUBLIC_KEY=BFarnYqUAFW5QEds5F0JQoL4BBpkApdV0hi9unggIHSky4wLmOJgEpIQEGVbHIJ36pL0kvv14mOlYD8orYzqXAM \
            VAPID_EMAIL=hola@zepo.app \
            RESEND_API_KEY="$RESEND_API_KEY" \
            FROM_EMAIL="Zepo <hola@zepo.lynoia.com>" \
            --project-ref vchaxqisbypwwtyjjnjr
