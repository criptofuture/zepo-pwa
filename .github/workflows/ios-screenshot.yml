name: iOS Screenshot QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ios-qa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs = json.load(sys.stdin)['devices']
          # Prefer iPhone 16 Pro, fall back to any iPhone Pro, then any iPhone
          candidates = []
          for runtime, devices in devs.items():
            if 'iOS' not in runtime: continue
            for d in devices:
              if d['isAvailable']:
                candidates.append(d)
          for pref in ['iPhone 16 Pro', 'iPhone 15 Pro', 'iPhone']:
            for c in candidates:
              if pref in c['name']:
                print(c['udid']); sys.exit(0)
          if candidates:
            print(candidates[0]['udid']); sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE"
          # boot returns immediately; block until the sim is FULLY booted or openurl times out (code=60)
          xcrun simctl bootstatus "$DEVICE" -b
          echo "DEVICE_UDID=$DEVICE" >> "$GITHUB_ENV"

      - name: Set status bar
        run: xcrun simctl status_bar "$DEVICE_UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4

      - name: Start local server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Open PWA in Safari
        run: |
          # slower runner images still hit sporadic timeouts right after boot — retry a few times
          for i in 1 2 3 4 5; do
            xcrun simctl openurl "$DEVICE_UDID" "http://localhost:8080/index.html" && exit 0
            echo "openurl attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "openurl failed after 5 attempts"
          exit 1

      - name: Wait for load
        run: sleep 8

      - name: Take screenshots
        run: |
          xcrun simctl io "$DEVICE_UDID" screenshot ios-home.png
          echo "Screenshot saved: ios-home.png"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: "*.png"
          retention-days: 14
