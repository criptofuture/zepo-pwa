    async saveBudgets() {
      this.savingBudget = true;
      const now = new Date();
      const month = now.getMonth() + 1;
      const year = now.getFullYear();
      try {
        await sb.from('budgets').delete()
          .eq('user_id', this.user.id)
          .eq('month', month)
          .eq('year', year);
        const rows = [];
        for (const [key, val] of Object.entries(this.budgetForm)) {
          if (!val || parseFloat(val) <= 0) continue;
          // Pro plan: only total budget. Elite: per-category budgets too.
          if (this.userPlan === 'pro' && key !== '_total') continue;
          rows.push({
            user_id: this.user.id,
            category: key === '_total' ? null : key,
            amount: parseFloat(val),
            month, year
          });
        }
        if (rows.length > 0) {
          const { error } = await sb.from('budgets').insert(rows);
          if (error) throw error;
        }
        await this.loadBudgets();
        this.budgetSheetOpen = false;
        this.showToast('Presupuestos guardados');
      } catch (e) { this.showToast('Error: ' + e.message); }
      this.savingBudget = false;
    },

    get budgetBars() {
      return this.budgets.filter(b => b.category).map(b => {
        const spent = this.monthExpenses.filter(e => e.category === b.category).reduce((s, e) => s + e.amount, 0);
        const cat = CAT_MAP[b.category] || {};
        return { cat: b.category, label: cat.label || b.category, emoji: cat.emoji || '✨', color: cat.color || '#8888AA', budget: b.amount, spent, pct: Math.round(spent / b.amount * 100) };
      });
    },

    get budgetAlerts() {
      const alerts = [];
      this.budgetBars.forEach(b => {
        if (b.pct >= 80) alerts.push(b);
      });
      const totalBudget = this.budgets.find(b => !b.category);
      if (totalBudget) {
        const pct = Math.round(this.monthTotal / totalBudget.amount * 100);
        if (pct >= 80) alerts.push({ cat: '_total', label: 'Total mensual', pct, spent: this.monthTotal, budget: totalBudget.amount });
      }
      return alerts;
    },

    // ── Export Excel ──
    async exportExcel() {
      if (this.userPlan !== 'elite') { this.tab = 'plans'; return this.showToast('Exportar requiere plan Elite'); }
      const { data } = await sb.from('expenses').select('*').eq('user_id', this.user.id).order('date', { ascending: false });
      if (!data || !data.length) return this.showToast('No hay datos');
      const header = ['Fecha','Categoría','Descripción','Monto','Tipo','Split','Persona','Pendiente'];
      const rows = data.map(e => [
        e.date, CAT_MAP[e.category]?.label || e.category, e.description || '',
        e.amount, e.is_income ? 'Ingreso' : 'Gasto',
        e.is_split ? 'Si' : 'No', e.split_persona || '', e.split_pending || 0
      ]);
      const xml = this.buildExcelXML(header, rows);
      const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zepo-gastos.xls';
      a.click();
      this.showToast('Excel descargado');
    },

    buildExcelXML(header, rows) {
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<?mso-application progid="Excel.Sheet"?>\n';
      xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
      xml += '<Worksheet ss:Name="Gastos"><Table>\n';
      xml += '<Row>' + header.map(h => `<Cell><Data ss:Type="String">${h}</Data></Cell>`).join('') + '</Row>\n';
      rows.forEach(r => {
        xml += '<Row>' + r.map((c, i) => {
          const type = (i === 3 || i === 7) ? 'Number' : 'String';
          return `<Cell><Data ss:Type="${type}">${c}</Data></Cell>`;
        }).join('') + '</Row>\n';
      });
      xml += '</Table></Worksheet></Workbook>';
      return xml;
    },

    openEdit(exp) {
      this.editingExpense = exp;
      this.saving = false;
      this.removeReceipt();
      // Rebuild split_people array from legacy split_persona (comma-separated names) + split_pct (your %)
      let splitPeople = [];
      if (exp.is_split && exp.split_pct != null) {
        const others = (exp.split_persona || '').split(',').map(s => s.trim()).filter(Boolean);
        const tuPct = parseFloat(exp.split_pct) || 50;
        const othersTotalPct = Math.max(0, 100 - tuPct);
        const eachOtherPct = others.length > 0 ? othersTotalPct / others.length : othersTotalPct;
        splitPeople = [
          { name: 'Tú', pct: tuPct, you: true, color: this.splitColorPalette[0] },
          ...others.map((name, i) => ({ name, pct: eachOtherPct, color: this.splitColorPalette[(i + 1) % this.splitColorPalette.length] })),
        ];
        if (splitPeople.length < 2) splitPeople.push({ name: '', pct: othersTotalPct, color: this.splitColorPalette[1] });
      }
      this.form = {
        amount: exp.is_split ? exp.split_total : exp.amount,
        description: exp.description || '',
        category: exp.category,
        date: exp.date,
        is_income: exp.is_income || false,
        is_split: exp.is_split || false,
        split_persona: exp.split_persona || '',
        split_pct: exp.split_pct || '',
        split_people: splitPeople,
      };
      this.sheetOpen = true;
    },

    async saveExpense() {
      if (!this.form.amount) return this.showToast('Ingresa un monto');
      if (!this.form.category) return this.showToast('Selecciona una categoría');
      if (!this.form.date) this.form.date = localDate();
      if (this.userPlan === 'free' && !this.editingExpense && this.monthExpenses.length >= 10) {
        this.showToast('Límite de 10 gastos/mes alcanzado');
        this.tab = 'plans';
        this.sheetOpen = false;
        return;
      }
      this.saving = true;
      try {
        const totalAmount = parseFloat(this.form.amount);
        // Map multi-person split (split_people) → legacy split_persona/split_pct for backwards compat
        let isSplit = false, pct = 0, persona = '';
        if (this.form.is_split && this.form.split_people && this.form.split_people.length >= 2) {
          const tuPerson = this.form.split_people.find(p => p.you);
          const others = this.form.split_people.filter(p => !p.you);
          if (tuPerson && others.length > 0 && this.splitSum > 0) {
            isSplit = true;
            pct = parseFloat(tuPerson.pct) || 50;
            persona = others.map(p => p.name || 'Sin nombre').filter(Boolean).join(', ') || 'Sin nombre';
            this.form.split_persona = persona;
            this.form.split_pct = pct;
          }
        }
        const miParte = isSplit ? Math.round(totalAmount * pct / 100 * 100) / 100 : totalAmount;
        const pendiente = isSplit ? Math.round((totalAmount - miParte) * 100) / 100 : 0;

        const payload = {
          user_id: this.user.id,
          amount: miParte,
          category: this.form.category,
          description: this.form.description,
          date: this.form.date,
          is_income: this.form.is_income,
          is_split: isSplit,
          split_total: isSplit ? totalAmount : null,
          split_pct: isSplit ? pct : null,
          split_persona: isSplit ? persona : null,
          split_pending: isSplit ? pendiente : null,
          split_status: isSplit ? 'pendiente' : null
        };

        if (this.editingExpense) {
          const { error } = await sb.from('expenses')
            .update(payload)
            .eq('id', this.editingExpense.id);
          if (error) throw error;
          if (this.receiptFile) {
            const path = await this.uploadReceipt(this.editingExpense.id);
            if (path) await sb.from('expenses').update({ receipt_image_path: path }).eq('id', this.editingExpense.id);
          }
          this.showToast('Gasto actualizado');
        } else {
          const { data: inserted, error } = await sb.from('expenses')
            .insert(payload)
            .select('id')
            .single();
          if (error) throw error;
          if (this.receiptFile && inserted) {
            const path = await this.uploadReceipt(inserted.id);
            if (path) await sb.from('expenses').update({ receipt_image_path: path }).eq('id', inserted.id);
          }
          this.showToast(isSplit ? '💸 Split guardado' : 'Gasto agregado');
        }

        this.sheetOpen = false;
        await this.loadExpenses();
        if (isSplit) await this.loadSplits();
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
      this.saving = false;
    },

    async deleteExpense() {
      if (!this.editingExpense) return;
      if (!confirm('¿Eliminar este gasto? Esta acción no se puede deshacer.')) return;
      try {
        const { error } = await sb.from('expenses')
          .delete()
          .eq('id', this.editingExpense.id);
        if (error) throw error;
        this.sheetOpen = false;
        this.editingExpense = null;
        this.showToast('Gasto eliminado');
        await this.loadExpenses();
        await this.loadSplits();
      } catch (e) {
        console.error('deleteExpense error:', e);
        this.showToast('Error: ' + e.message);
      }
    },

    async loadSplits() {
      const { data: pending } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .eq('is_split', true)
        .eq('split_status', 'pendiente')
        .order('date', { ascending: false });
      this.pendingSplits = pending || [];
      const { data: paid } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .eq('is_split', true)
        .eq('split_status', 'cobrado')
        .order('date', { ascending: false })
        .limit(20);
      this.paidSplits = paid || [];
    },

    relativeTime(dateStr) {
      if (!dateStr) return '';
      const now = new Date();
      const date = new Date(dateStr);
      const diff = Math.max(0, (now - date) / 1000);
      if (diff < 60) return 'ahora';
      if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + 'm';
      if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + 'h';
      if (diff < 86400 * 7) return 'hace ' + Math.floor(diff / 86400) + 'd';
      if (diff < 86400 * 30) return 'la sem.';
      return 'hace ' + Math.floor(diff / (86400 * 30)) + 'mes';
    },

    isAutoCobro(exp) {
      return !!(exp.split_persona && exp.split_persona.includes(','));
    },

    cobroFor(exp, personaName) {
      const others = (exp.split_persona || '').split(',').map(s => s.trim()).filter(Boolean);
      const n = others.length || 1;
      const total = exp.split_total || (exp.amount + (exp.split_pending || 0));
      const tuPct = exp.split_pct || 50;
      const othersPct = (100 - tuPct) / n;
      return Math.round(total * othersPct / 100 * 100) / 100;
    },

    get filteredPendingCobros() {
      const q = (this.cobrosSearch || '').toLowerCase().trim();
      const rows = [];
      this.pendingSplits.forEach(exp => {
        const others = (exp.split_persona || 'Sin nombre').split(',').map(s => s.trim()).filter(Boolean);
        const amt = this.cobroFor(exp);
        others.forEach(name => {
          if (!q || name.toLowerCase().includes(q)) rows.push({ ...exp, _person: name, _amount: amt });
        });
      });
      return rows;
    },

    get filteredPaidCobros() {
      const q = (this.cobrosSearch || '').toLowerCase().trim();
      const rows = [];
      this.paidSplits.forEach(exp => {
        const others = (exp.split_persona || 'Sin nombre').split(',').map(s => s.trim()).filter(Boolean);
        const amt = this.cobroFor(exp);
        others.forEach(name => {
          if (!q || name.toLowerCase().includes(q)) rows.push({ ...exp, _person: name, _amount: amt });
        });
      });
      return rows;
    },

    get totalPendingAmount() {
      return this.filteredPendingCobros.reduce((s, c) => s + (c._amount || 0), 0);
    },

    get knownPersonas() {
      const names = new Set();
      this.expenses.forEach(e => { if (e.split_persona) names.add(e.split_persona); });
      this.pendingSplits.forEach(e => { if (e.split_persona) names.add(e.split_persona); });
      return [...names].sort();
    },

    get splitsByPersona() {
      const groups = {};
      this.pendingSplits.forEach(e => {
        const name = e.split_persona || 'Sin nombre';
        if (!groups[name]) groups[name] = [];
        groups[name].push(e);
      });
      return groups;
    },

    get filteredSplitsByPersona() {
      const q = this.cobrosSearch.toLowerCase().trim();
      if (!q) return this.splitsByPersona;
      const filtered = {};
      Object.entries(this.splitsByPersona).forEach(([name, group]) => {
        if (name.toLowerCase().includes(q)) filtered[name] = group;
      });
      return filtered;
    },

    async saveManualCobro() {
      const f = this.newCobroForm;
      if (!f.persona || !f.amount) return this.showToast('Faltan datos');
      const amt = parseFloat(f.amount);
      const payload = {
        user_id: this.user.id,
        amount: 0,
        category: 'other',
        description: f.description || ('Cobro a ' + f.persona),
        date: localDate(),
        is_income: false,
        is_split: true,
        split_total: amt,
        split_pct: 0,
        split_persona: f.persona,
        split_pending: amt,
        split_status: 'pendiente',
      };
      const { error } = await sb.from('expenses').insert([payload]);
      if (error) return this.showToast('Error: ' + error.message);
      this.showToast('Cobro creado');
      this.newCobroOpen = false;
      this.newCobroForm = { persona: '', amount: '', description: '' };
      await this.loadSplits();
    },

    async markSplitPaid(id) {
      const { error } = await sb.from('expenses')
        .update({ split_status: 'cobrado', split_pending: 0 })
        .eq('id', id);
      if (error) return this.showToast('Error: ' + error.message);
      this.showToast('✅ Cobro registrado');
      await this.loadSplits();
    },

    async exportData() {
      if (this.userPlan !== 'elite') { this.tab = 'plans'; return this.showToast('Exportar requiere plan Elite'); }
      const { data } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .order('date', { ascending: false });
      if (!data || !data.length) return this.showToast('No hay datos');
      const csv = 'fecha,categoría,descripción,monto,tipo\n' + data.map(e =>
        `${e.date},${e.category},"${(e.description || '').replace(/"/g, '""')}",${e.amount},${e.is_income ? 'ingreso' : 'gasto'}`
      ).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zepo-gastos.csv';
      a.click();
      this.showToast('CSV descargado');
    },

    async installApp() {
      if (this.installPrompt) {
        this.installPrompt.prompt();
        this.installPrompt = null;
      }
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => this.toast = '', 2500);
    },

    fmtMoney(n) {
      return (n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    },

    getCatEmoji(key) { return CAT_MAP[key]?.emoji || '✨'; },
    getCatLabel(key) { return CAT_MAP[key]?.label || key; },
    getCatColor(key) { return CAT_MAP[key]?.color || '#8888AA'; },

    formatDate(d) {
      if (!d) return '';
      const today = localDate();
      const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
      if (d === today) return 'Hoy';
      if (d === yesterday) return 'Ayer';
      return new Date(d + 'T12:00:00').toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });
    },

    formatTime(dt) {
      if (!dt) return '';
      return new Date(dt).toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
    },

    get todayLabel() {
      const d = new Date();
      const days = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
      return days[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTH_NAMES[d.getMonth()].toLowerCase();
    },

    get totalBudgetObj() {
      return this.budgets.find(b => !b.category) || null;
    },

    get totalBudgetPct() {
      if (!this.totalBudgetObj) return 0;
      return Math.round(this.monthTotal / this.totalBudgetObj.amount * 100);
    },

    get pwStrength() {
      const pw = this.pwForm.newPw || '';
      let score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 8) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      const labels = ['', 'DEBIL', 'REGULAR', 'FUERTE', 'MUY FUERTE'];
      const colors = ['', 'var(--danger)', 'var(--warning)', 'var(--success)', 'var(--success)'];
      return { level: score, label: labels[score] || '', color: colors[score] || '' };
    },

    async changePassword() {
      if (!this.pwForm.current) return this.showToast('Ingresa tu contraseña actual');
      if (this.pwForm.newPw !== this.pwForm.confirm) return this.showToast('Las contraseñas no coinciden');
      if (this.pwForm.newPw.length < 6) return this.showToast('Minimo 6 caracteres');
      this.changingPw = true;
      try {
        const { error: authErr } = await sb.auth.signInWithPassword({ email: this.user.email, password: this.pwForm.current });
        if (authErr) throw new Error('Contraseña actual incorrecta');
        const { error } = await sb.auth.updateUser({ password: this.pwForm.newPw });
        if (error) throw error;
        this.pwForm = { current: '', newPw: '', confirm: '' };
        this.showToast('Contraseña actualizada');
        this.tab = 'settings';
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
      this.changingPw = false;
    },

    async finishOnboardingFirst() {
      // Save first expense if user filled it, then navigate to home
      const amount = parseFloat(this.onboardingFirstAmount) || 12.50;
      const desc = this.onboardingFirstDesc || 'Almuerzo de prueba';
      this.form = {
        amount: amount,
        description: desc,
        category: this.onboardingFirstCat || 'food',
        date: localDate(),
        is_income: false, is_split: false, split_persona: '', split_pct: '', split_people: []
      };
      this.editingExpense = null;
      try {
        await this.saveExpense();
      } catch (e) { /* ignore — go to home anyway */ }
      this.tab = 'onb-budget';
    },

    async saveOnboardingBudget() {
      const amount = parseFloat(this.onboardingBudget);
      if (!amount || amount <= 0) { this.tab = 'onb-method'; return; }
      const now = new Date();
      try {
        await sb.from('budgets').insert({
          user_id: this.user.id,
          category: null,
          amount: amount,
          month: now.getMonth() + 1,
          year: now.getFullYear()
        });
        await this.loadBudgets();
        this.showToast('Presupuesto guardado');
      } catch (e) { this.showToast('Error: ' + e.message); }
      this.tab = 'onb-method';
    },

    get daysUntilSunset() {
      const sunset = new Date('2026-12-31');
      const today = new Date();
      const diff = Math.ceil((sunset - today) / 86400000);
      return Math.max(0, diff);
    },

    analyzeTextInput() {
      const text = this.form.description || '';
      if (!text || text.length < 2) return;
      this.analyzing = true;
      // Use existing heuristic parser (parseVoiceText) — it sets amount + category + is_income
      setTimeout(() => {
        this.parseVoiceText(text);
        this.analyzing = false;
        this.analyzed = true;
        setTimeout(() => { this.analyzed = false; }, 4000);
      }, 600);
    },

    finishOnboarding() {
      // Mark onboarding complete + go home
      localStorage.setItem('zepo:onboarded', '1');
      if (this.onboardingMethod) localStorage.setItem('zepo:preferred-method', this.onboardingMethod);
      this.tab = 'home';
    },

    async sendPasswordReset() {
      if (!this.forgotEmail || !this.forgotEmail.includes('@')) return this.showToast('Email inválido');
      this.forgotLoading = true;
      try {
        const { error } = await sb.auth.resetPasswordForEmail(this.forgotEmail, {
          redirectTo: window.location.origin + window.location.pathname
        });
        if (error) throw error;
        this.forgotSent = true;
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
      this.forgotLoading = false;
    },

    async confirmDeleteAccount() {
      if (this.deleteConfirmText !== 'ELIMINAR') return;
      this.showDeleteModal = false;
      await this.deleteAccount();
    },

    async loadUserPlan() {
      if (!this.user) return;
      const { data } = await sb.from('users').select('plan, plan_expires_at').eq('id', this.user.id).maybeSingle();
      if (data) {
        this.userPlan = data.plan || 'free';
        this.planExpiresAt = data.plan_expires_at;
      }
    },

    get planOptions() {
      const annual = this.annualBilling;
      const monthly = (m) => annual ? (m * 10 / 12).toFixed(2) : m.toFixed(2);
      return [
        {
          key: 'free', label: 'FREE', tagline: 'Para empezar a registrar',
          price: '0', priceRegular: '0', period: '/mes',
          warning: 'Hasta 31 dic 2026',
          features: [
            { v: true,  l: 'Entrada manual de gastos' },
            { v: true,  l: 'Historial de 1 mes' },
            { v: true,  l: '6 categorías fijas' },
            { v: true,  l: 'Solo USD' },
            { v: false, l: 'IA · texto + voz' },
            { v: false, l: 'Foto de recibo · OCR' },
            { v: false, l: 'Dashboard con gráficos' },
          ],
        },
        {
          key: 'pro', label: 'PRO', tagline: 'Para llevarlo en serio',
          price: monthly(5), priceRegular: '10.00', period: '/mes',
          highlight: 'MÁS POPULAR',
          features: [
            { v: true, l: 'Todo de Free' },
            { v: true, l: 'IA · texto libre + voz' },
            { v: true, l: 'Historial ilimitado' },
            { v: true, l: 'Categorías ilimitadas + custom' },
            { v: true, l: 'Cualquier moneda LATAM' },
            { v: true, l: 'Presupuesto mensual + alertas' },
            { v: false, l: 'Foto de recibo · OCR' },
            { v: false, l: 'Dashboard + analytics' },
          ],
        },
        {
          key: 'elite', label: 'ELITE', tagline: 'Cuando quieres todo automático',
          price: monthly(10), priceRegular: '20.00', period: '/mes',
          highlight: 'COMPLETO', gradient: true,
          features: [
            { v: true, l: 'Todo de Pro' },
            { v: true, l: 'Foto de recibo · OCR' },
            { v: true, l: 'Importar PDF/CSV/Excel' },
            { v: true, l: 'Presupuesto por categoría' },
            { v: true, l: 'Exportar CSV / Excel' },
            { v: true, l: 'Dashboard + analytics' },
            { v: true, l: 'Resumen semanal email' },
            { v: true, l: 'Soporte prioritario' },
          ],
        },
      ];
    },

    get checkoutPrice() {
      return this.checkoutPlan === 'elite' ? '10.00' : '5.00';
    },

    startCheckout(plan) {
      this.checkoutPlan = plan;
      this.tab = 'checkout';
    },

    async initiatePayment() {
      this.paymentLoading = true;
      this.paymentError = '';
      try {
        const resp = await fetch(SUPABASE_URL + '/functions/v1/create-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (await sb.auth.getSession()).data.session.access_token,
          },
          body: JSON.stringify({ plan: this.checkoutPlan }),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Error al crear pago');
        if (result.paymentUrl) {
          this.tab = 'pay-processing';
          window.location.href = result.paymentUrl;
        }
      } catch (e) {
        this.paymentError = e.message;
        this.tab = 'pay-failed';
      }
      this.paymentLoading = false;
    },

    async handlePaymentReturn() {
      const params = new URLSearchParams(window.location.search);
      const payId = params.get('id');
      const clientTxId = params.get('clientTransactionId');
      if (!payId || !clientTxId) return;
      this.tab = 'pay-processing';
      try {
        const resp = await fetch(SUPABASE_URL + '/functions/v1/confirm-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (await sb.auth.getSession()).data.session.access_token,
          },
          body: JSON.stringify({ id: parseInt(payId), clientTransactionId: clientTxId }),
        });
        const result = await resp.json();
        if (result.success) {
          this.userPlan = result.plan || this.checkoutPlan;
          this.tab = 'pay-success';
        } else {
          this.paymentError = result.error || 'Pago no confirmado';
          this.tab = 'pay-failed';
        }
      } catch (e) {
        this.paymentError = e.message;
        this.tab = 'pay-failed';
      }
      window.history.replaceState({}, '', window.location.pathname);
    },

    get weeklyChart() {
      const days = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
      const today = new Date();
      const result = [];
      let max = 1;
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toLocaleDateString('en-CA');
        const total = this.monthExpenses.filter(e => e.date === dateStr).reduce((s, e) => s + e.amount, 0);
        if (total > max) max = total;
        result.push({ label: days[d.getDay()], total, isToday: i === 0 });
      }
      result.forEach(d => d.pct = Math.round(d.total / max * 100));
      return result;
    },

    get categoryBreakdown() {
      const totals = {};
      this.monthExpenses.forEach(e => {
        if (!totals[e.category]) totals[e.category] = 0;
        totals[e.category] += e.amount;
      });
      const total = this.monthTotal || 1;
      return Object.entries(totals)
        .sort((a, b) => b[1] - a[1])
        .map(([key, val]) => ({
          key, total: val,
          pct: Math.round(val / total * 100),
          label: CAT_MAP[key]?.label || key,
          emoji: CAT_MAP[key]?.emoji || '✨',
          color: CAT_MAP[key]?.color || '#8888AA',
        }));
    },
  };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
