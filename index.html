<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zepo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    /* ═══ RESET + BASE ═══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    input, button, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* ═══ DESIGN TOKENS ═══ */
    :root {
      --bg: #0A0A0F;
      --surface: #13131A;
      --surface2: #191923;
      --border: #1E1E2E;
      --border2: #2A2A3D;
      --cyan: #00F0FF;
      --purple: #7000FF;
      --gradient: linear-gradient(135deg, #00F0FF 0%, #7000FF 100%);
      --text: #FFFFFF;
      --muted: #8888AA;
      --dim: #5A5A75;
      --success: #00E5A0;
      --warning: #FFB800;
      --danger: #FF6B6B;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-pill: 50px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ═══ UTILITY ═══ */
    .gradient-text {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-border {
      position: relative;
      border-radius: var(--radius);
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: var(--gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ═══ APP SHELL ═══ */
    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ═══ AUTH SCREENS ═══ */
    .auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 0;
      padding-top: calc(var(--safe-top) + 32px);
      overflow-y: auto;
    }
    .auth-logo-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 4px;
    }
    .auth-logo {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 24px; font-weight: 800;
    }
    .auth-logo-name { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .auth-title { font-size: 32px; font-weight: 700; text-align: center; letter-spacing: -1px; line-height: 1.1; }
    .auth-subtitle { font-size: 15px; color: var(--muted); text-align: center; margin-top: -10px; }
    .auth-form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .auth-input {
      width: 100%;
      padding: 16px 18px;
      height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,240,255,0.08); }
    .auth-input::placeholder { color: var(--dim); }
    .auth-btn {
      width: 100%;
      padding: 16px;
      height: 52px;
      border-radius: 26px;
      background: var(--gradient);
      color: #0A0A0F;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      transition: opacity 0.2s;
      margin-top: 4px;
      box-shadow: 0 4px 24px rgba(0,240,255,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .auth-btn:disabled { opacity: 0.5; }
    .auth-btn:active { opacity: 0.8; }
    .auth-forgot {
      font-size: 13px; color: var(--cyan); font-weight: 600;
      text-align: center; text-decoration: underline; text-underline-offset: 3px;
      margin-top: 16px; width: 100%;
    }
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      width: 100%; margin-top: 28px; margin-bottom: 18px;
      font-size: 12px; color: var(--muted); letter-spacing: 1px; font-weight: 600;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .auth-oauth-btn {
      width: 100%; height: 50px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 13px; font-weight: 600; color: var(--text);
      transition: border-color 0.2s;
    }
    .auth-oauth-btn:active { border-color: var(--cyan); }
    .auth-switch {
      font-size: 13px; color: var(--muted); text-align: center;
    }
    .auth-switch button {
      color: var(--cyan); font-weight: 600; font-size: 13px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .auth-error {
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.3);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      width: 100%;
    }

    /* ═══ MAIN CONTENT ═══ */
    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 100px;
    }
    .screen-header {
      padding: 16px 20px;
      padding-top: calc(var(--safe-top) + 16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .screen-header h1 { font-size: 22px; font-weight: 800; }

    /* ═══ TAB BAR ═══ */
    .tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 84px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-top: 8px;
      padding-bottom: calc(var(--safe-bottom) + 24px);
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 12px;
      font-size: 9px;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.2s;
      letter-spacing: 0.2px;
      position: relative;
      width: 56px;
    }
    .tab-item.active { color: var(--cyan); font-weight: 700; }
    .tab-item.locked { opacity: 0.4; }
    .tab-item .lock-dot {
      position: absolute; top: -4px; right: 2px;
      width: 14px; height: 14px; border-radius: 7px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
    }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item.active svg { stroke-width: 2.4; }

    /* ═══ FAB ═══ */
    .fab {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px; height: 64px;
      border-radius: 32px;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px #0A0A0F, 0 8px 32px rgba(0,240,255,0.4), 0 0 48px rgba(112,0,255,0.3);
      z-index: 51;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .fab:active { transform: translateX(-50%) scale(0.92); }
    .fab svg { width: 28px; height: 28px; stroke: #0A0A0F; stroke-width: 2.6; }
    .fab.pulse { animation: fabPulse 2s ease-in-out infinite; }
    @keyframes fabPulse {
      0%, 100% { box-shadow: 0 0 0 4px #0A0A0F, 0 8px 32px rgba(0,240,255,0.4), 0 0 48px rgba(112,0,255,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(0,240,255,0.15), 0 8px 32px rgba(0,240,255,0.5), 0 0 48px rgba(112,0,255,0.4); }
    }

    /* ═══ PAGE HEADER ═══ */
    .page-header {
      padding: 14px 20px 8px;
      padding-top: calc(var(--safe-top) + 14px);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-header .ph-left { flex: 1; min-width: 0; }
    .page-header .ph-title { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .page-header .ph-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .page-header .ph-actions { display: flex; gap: 8px; align-items: center; }
    .ph-icon-btn {
      width: 40px; height: 40px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .ph-icon-btn svg { width: 18px; height: 18px; color: var(--text); }
    .ph-icon-btn .notif-dot {
      position: absolute; top: 6px; right: 6px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--cyan); border: 2px solid var(--surface);
    }
    .plan-badge {
      padding: 3px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
    }
    .plan-badge.free { background: rgba(136,136,170,0.15); color: var(--muted); }
    .plan-badge.pro { background: rgba(0,240,255,0.12); color: var(--cyan); border: 1px solid rgba(0,240,255,0.3); }
    .plan-badge.elite { background: var(--gradient); color: #0A0A0F; }

    /* ═══ SETTINGS SCREEN ═══ */
    .settings-group {
      margin: 0 20px 14px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .settings-group-title {
      font-size: 11px; color: var(--muted); letter-spacing: 1.4px; font-weight: 700;
      padding: 0 20px; margin-top: 22px; margin-bottom: 8px; text-transform: uppercase;
    }
    .settings-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; width: 100%;
      border-top: 1px solid var(--border);
      font-size: 14px; font-weight: 500;
    }
    .settings-item:first-child { border-top: none; }
    .settings-item .si-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .settings-item svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
    .settings-item .si-label { flex: 1; font-size: 14px; }
    .settings-item .si-value { font-size: 13px; color: var(--muted); }
    .settings-item .si-chevron { color: var(--dim); }
    .settings-item.danger { color: var(--danger); }
    .settings-item.danger svg { color: var(--danger); }
    .settings-item.danger .si-icon { background: rgba(255,107,107,0.12); }

    /* ═══ MODAL OVERLAY ═══ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-card {
      width: 100%; max-width: 360px;
      background: var(--surface); border-radius: 22px;
      border: 1px solid var(--border2);
      padding: 26px 22px 20px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    }

    /* ═══ EMPTY STATE ═══ */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 60px 28px;
    }
    .empty-icon {
      width: 112px; height: 112px; border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 22px;
    }
    .empty-title { font-size: 24px; font-weight: 700; letter-spacing: -0.6px; margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: var(--muted); line-height: 1.5; max-width: 300px; }

    /* ═══ PAYMENT FLOW ═══ */
    .checkout-summary {
      background: var(--surface); border-radius: 14px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .checkout-row {
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px;
    }
    .checkout-row.total {
      padding: 14px; border-top: 1px solid var(--border);
      background: rgba(0,240,255,0.04);
      font-weight: 700; font-size: 14px;
    }
    .pay-btn {
      width: 100%; height: 56px; border-radius: 28px;
      background: var(--gradient); border: none; color: #0A0A0F;
      font-weight: 700; font-size: 16px; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 24px rgba(0,240,255,0.25);
      letter-spacing: -0.2px;
    }
    .pay-btn:active { opacity: 0.85; }
    .pay-spinner {
      width: 120px; height: 120px; position: relative; margin: 0 auto 38px;
    }
    .pay-spinner .track {
      position: absolute; inset: 0; border-radius: 50%;
      border: 4px solid var(--border);
    }
    .pay-spinner .arc {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--cyan) 0deg, var(--purple) 240deg, transparent 250deg, transparent 360deg);
      -webkit-mask: radial-gradient(circle, transparent 54px, black 56px);
      mask: radial-gradient(circle, transparent 54px, black 56px);
      filter: drop-shadow(0 0 12px rgba(0,240,255,0.6));
      animation: spin 1.1s linear infinite;
    }

    /* ═══ DASHBOARD ═══ */
    .dash-card {
      background: var(--surface); border-radius: 16px;
      border: 1px solid var(--border); padding: 18px;
      margin: 0 20px 14px;
    }
    .dash-card-title {
      font-size: 14px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 2px;
    }
    .dash-card-subtitle {
      font-size: 11px; color: var(--muted); margin-bottom: 14px;
    }
    .dash-period-selector {
      display: flex; gap: 0; margin: 0 20px 14px;
      background: var(--surface); border-radius: 11px;
      border: 1px solid var(--border); padding: 4px;
    }
    .dash-period-btn {
      flex: 1; padding: 8px; border-radius: 9px;
      font-size: 12px; font-weight: 600; text-align: center;
      color: var(--muted); transition: all 0.15s;
    }
    .dash-period-btn.active {
      background: var(--bg); color: var(--text);
    }
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar-fill { width: 100%; border-radius: 4px; min-height: 4px; transition: height 0.4s; }
    .bar-label { font-size: 10px; color: var(--dim); }
    .insight-card {
      background: var(--surface); border-radius: 14px;
      border: 1px solid var(--border); padding: 14px;
      margin: 0 20px 10px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .insight-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ═══ HERO CARD ═══ */
    .hero-card {
      margin: 0 20px 20px;
      padding: 20px 22px 18px;
      background: var(--surface);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }
    .hero-card.gradient-border { border-radius: 20px; }
    .hero-card.gradient-border::before { border-radius: 20px; }
    .hero-card.glow {
      box-shadow: 0 0 32px rgba(0,240,255,0.18), 0 0 64px rgba(112,0,255,0.12);
    }
    .hero-top-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .hero-label {
      font-size: 11px; color: var(--muted); font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
    }
    .hero-delta {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
    }
    .hero-delta.up { color: var(--danger); }
    .hero-delta.down { color: var(--success); }
    .hero-delta svg { width: 11px; height: 11px; }
    .hero-amount-row {
      display: flex; align-items: baseline; gap: 4px; margin-bottom: 14px;
    }
    .hero-currency {
      font-size: 20px; color: var(--muted); font-weight: 600; margin-right: 2px;
    }
    .hero-amount {
      font-size: 48px; font-weight: 800; letter-spacing: -2.2px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hero-progress {
      position: relative; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .hero-progress-fill {
      position: absolute; inset: 0; border-radius: 3px;
      background: var(--gradient);
    }
    .hero-progress-marker {
      position: absolute; top: -2px; width: 1.5px; height: 10px;
      background: var(--text); opacity: 0.9;
    }
    .hero-progress-labels {
      display: flex; justify-content: space-between; margin-top: 8px;
      font-size: 11px; color: var(--muted);
    }
    .hero-stats {
      display: flex; gap: 24px; margin-top: 16px;
    }
    .hero-stat-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .hero-stat-value { font-size: 16px; font-weight: 700; margin-top: 2px; }

    /* ═══ STAT CARDS ROW ═══ */
    .stat-row {
      display: flex; gap: 8px;
      padding: 0 20px;
      margin-bottom: 24px;
    }
    .stat-card {
      flex: 1 1 0; min-width: 0;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 14px;
      position: relative;
    }
    .stat-card.locked { opacity: 0.55; }
    .stat-card .lock-icon {
      position: absolute; top: 12px; right: 12px;
    }
    .stat-card-label {
      font-size: 10px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; font-weight: 600; margin-bottom: 6px;
    }
    .stat-card-value { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-top: 0; font-variant-numeric: tabular-nums; }
    .stat-card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ═══ SECTION ═══ */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-top: 22px;
      margin-bottom: 8px;
    }
    .section-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .section-action {
      font-size: 12px; color: var(--cyan); font-weight: 600;
      display: flex; align-items: center; gap: 2px;
    }

    /* ═══ EXPENSE ROW ═══ */
    .expense-list {
      margin: 0 20px;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 4px 14px;
    }
    .expense-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .expense-row + .expense-row { border-top: 1px solid var(--border); }
    .expense-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .expense-info { flex: 1; min-width: 0; }
    .expense-desc {
      font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .expense-meta {
      font-size: 11px; color: var(--muted); margin-top: 2px;
      display: flex; align-items: center; gap: 5px;
    }
    .expense-amount {
      font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
      text-align: right; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .expense-amount.income { color: var(--success); }

    /* ═══ INPUT SHEET (Bottom Sheet) ═══ */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
    }
    .approve-screen {
      position: fixed;
      inset: 0;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg);
      z-index: 101;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .approve-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px 12px;
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .approve-back {
      width: 36px; height: 36px; border-radius: 18px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .approve-back svg { width: 18px; height: 18px; stroke: var(--text); stroke-width: 2; fill: none; }
    .approve-title { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .source-badge {
      font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); letter-spacing: 0.6px;
    }
    .amount-box {
      padding: 20px 18px; border-radius: 16px;
      background: linear-gradient(160deg, rgba(0,240,255,0.06), rgba(112,0,255,0.06));
      border: 1px solid var(--border2);
      margin-bottom: 14px;
    }
    .amount-box .amount-label {
      font-size: 11px; color: var(--muted); letter-spacing: 1px; font-weight: 600; margin-bottom: 6px;
    }
    .amount-box .amount-row {
      display: flex; align-items: baseline; gap: 6px;
    }
    .amount-box .amount-dollar { font-size: 22px; color: var(--muted); font-weight: 600; }
    .amount-box .amount-value {
      font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .amount-box .amount-value input {
      background: none; border: none; outline: none;
      font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1;
      font-variant-numeric: tabular-nums; width: 100%;
      background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-family: inherit;
    }
    .amount-box .amount-value input::placeholder { -webkit-text-fill-color: var(--dim); }
    .amount-box .amount-hint { margin-top: 6px; font-size: 12px; color: var(--dim); }
    .field-box { margin-bottom: 12px; }
    .field-box-label {
      font-size: 11px; color: var(--muted); letter-spacing: 1px; font-weight: 600; margin-bottom: 6px;
    }
    .field-box-inner {
      min-height: 50px; border-radius: 12px; background: var(--surface);
      border: 1px solid var(--border); padding: 0 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .field-box-inner input, .field-box-inner textarea {
      flex: 1; background: none; border: none; outline: none;
      font-size: 15px; font-weight: 500; color: var(--text); font-family: inherit;
    }
    .field-box-inner textarea {
      padding: 12px 0; min-height: 50px; resize: none; line-height: 1.5;
    }
    .field-box-inner input::placeholder, .field-box-inner textarea::placeholder { color: var(--dim); }
    .cat-chip-scroll {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px;
    }
    .cat-chip {
      padding: 8px 4px; border-radius: 10px; font-size: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: all 0.15s; cursor: pointer;
    }
    .cat-chip.selected { border-color: var(--cyan); background: rgba(0,240,255,0.08); color: var(--cyan); }
    .cat-icon-box {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .split-container {
      margin-top: 14px; border-radius: 14px; overflow: hidden;
    }
    .split-header {
      padding: 14px; display: flex; align-items: center; gap: 12px;
    }
    .split-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .split-toggle {
      width: 38px; height: 22px; border-radius: 11px; position: relative; cursor: pointer;
    }
    .split-toggle-knob {
      position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff;
      transition: left 0.2s;
    }
    .approve-btn {
      width: 100%; height: 52px; border-radius: 26px;
      background: var(--success); border: none; color: #0A0A0F;
      font-weight: 700; font-size: 16px; font-family: inherit; letter-spacing: -0.2px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 24px rgba(0,229,160,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
      cursor: pointer;
    }
    .approve-btn:disabled { opacity: 0.4; }
    .approve-btn:active { opacity: 0.8; }
    .cancel-btn {
      margin-top: 8px; width: 100%; height: 46px; border-radius: 23px;
      background: transparent; border: none;
      color: var(--muted); font-weight: 600; font-size: 14px; font-family: inherit;
      cursor: pointer;
    }
    .delete-btn {
      width: 100%; padding: 14px; border-radius: var(--radius-pill);
      border: 1px solid rgba(255,107,107,0.3); color: var(--danger);
      font-size: 14px; font-weight: 600; margin-top: 8px;
      background: rgba(255,107,107,0.05);
    }
    .sheet-tab-v2 {
      padding: 8px 12px; border-radius: 10px;
      font-size: 12px; font-weight: 600;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted);
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .sheet-tab-v2.active { background: var(--surface2); border-color: var(--cyan); color: var(--text); }
    .sheet-tab-v2.active svg { stroke: var(--cyan); }
    .sheet-tab-v2 svg { stroke: var(--muted); }
    .save-btn {
      width: 100%; padding: 16px; height: 52px;
      border-radius: var(--radius-pill); background: var(--gradient);
      color: #000; font-size: 16px; font-weight: 700; margin-top: 8px;
    }
    .save-btn:disabled { opacity: 0.4; }
    .save-btn:active { opacity: 0.8; }

    /* ═══ HISTORY SCREEN ═══ */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 0 20px 14px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .month-nav button {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
    }
    .month-nav span { font-size: 15px; font-weight: 700; min-width: 140px; text-align: center; }
    .filter-chips {
      display: flex;
      gap: 8px;
      padding: 0 20px 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 12px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .chip.active {
      border-color: transparent;
      background: var(--gradient);
      color: #0A0A0F;
      font-weight: 600;
    }
    .date-group { padding: 0 20px; margin-bottom: 14px; }
    .date-label {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-weight: 600;
      padding: 0 2px 8px;
      margin-bottom: 0;
      display: flex;
      justify-content: space-between;
    }
    .date-group .list-block {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 2px 14px;
    }
    .history-footer {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    /* ═══ PROFILE SCREEN ═══ */
    .profile-card {
      margin: 0 20px 16px;
      padding: 24px;
      background: var(--surface);
      border-radius: var(--radius);
      text-align: center;
    }
    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: #000;
      margin: 0 auto 12px;
    }
    .profile-name { font-size: 18px; font-weight: 700; }
    .profile-email { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .profile-menu {
      margin: 0 20px;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .profile-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      font-size: 15px;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      width: 100%;
      text-align: left;
    }
    .profile-menu-item:last-child { border-bottom: none; }
    .profile-menu-item svg { width: 20px; height: 20px; color: var(--muted); }
    .profile-menu-item.danger { color: var(--danger); }

    /* ═══ OFFLINE BANNER ═══ */
    .offline-banner {
      background: rgba(255,184,0,0.15);
      color: var(--warning);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 6px;
    }

    /* ═══ INSTALL PROMPT ═══ */
    .install-prompt {
      position: fixed;
      bottom: 80px; left: 20px; right: 20px;
      max-width: 390px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 60;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .install-prompt-text { flex: 1; }
    .install-prompt-text p { font-size: 14px; font-weight: 600; }
    .install-prompt-text span { font-size: 12px; color: var(--muted); }
    .install-btn {
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      background: var(--gradient);
      color: #000;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ═══ VOICE + PHOTO ═══ */
    .input-actions {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;
    }
    .input-action-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 500; color: var(--muted);
      transition: all 0.2s;
    }
    .input-action-btn:active { opacity: 0.7; }
    .input-action-btn.recording {
      border-color: var(--danger);
      color: var(--danger);
      animation: pulse-rec 1s infinite;
    }
    @keyframes pulse-rec { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .input-action-btn svg { width: 18px; height: 18px; }
    .receipt-preview {
      position: relative;
      margin-bottom: 16px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border2);
    }
    .receipt-preview img {
      width: 100%; max-height: 160px; object-fit: cover;
    }
    .receipt-preview .remove-receipt {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.7); color: var(--danger);
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .receipt-indicator {
      width: 16px; height: 16px; color: var(--muted); flex-shrink: 0;
    }

    /* ═══ BUDGET BARS ═══ */
    .budget-section { padding: 0 20px; margin-bottom: 24px; }
    .budget-bar-wrap {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 8px;
    }
    .budget-bar-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .budget-bar-label { font-size: 13px; font-weight: 600; }
    .budget-bar-amount { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .budget-bar-track {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    }
    .budget-bar-fill {
      height: 100%; border-radius: 3px; transition: width 0.4s ease;
    }
    .budget-alert {
      background: rgba(255,184,0,0.1);
      border: 1px solid rgba(255,184,0,0.3);
      color: var(--warning);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 500;
      margin: 0 20px 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .budget-alert.danger {
      background: rgba(255,107,107,0.1);
      border-color: rgba(255,107,107,0.3);
      color: var(--danger);
    }

    /* ═══ BUDGET MODAL ═══ */
    .budget-form { padding: 0 20px; }
    .budget-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 16px;
    }
    .budget-grid-item {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
    .budget-grid-item input {
      width: 100%; background: none; border: none; outline: none;
      color: var(--cyan); font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 600; margin-top: 4px;
    }
    .budget-grid-item input::placeholder { color: var(--dim); }

    /* ═══ LOADING ═══ */
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ TOAST ═══ */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%; transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
<!-- ═══════════════════ ALPINE APP ═══════════════════ -->
<div id="app" x-data="zepoApp()" x-init="init()">

  <!-- ░░░ OFFLINE BANNER ░░░ -->
  <div class="offline-banner" x-show="offline" x-cloak>
    Sin conexion — mostrando datos guardados
  </div>

  <!-- ░░░ AUTH: LOGIN / SIGNUP ░░░ -->
  <template x-if="!user">
    <div class="auth-screen">
      <div class="auth-logo-row" style="margin-bottom:40px;">
        <div class="auth-logo" style="width:36px;height:36px;border-radius:10px;font-size:20px;"><span class="gradient-text">Z</span></div>
        <span class="auth-logo-name">Zepo</span>
      </div>

      <h1 class="auth-title" style="text-align:left;margin-bottom:8px;">
        <span x-show="authMode === 'login'">Bienvenido <span class="gradient-text">de nuevo</span></span>
        <span x-show="authMode === 'signup'" style="font-size:30px;">Crea tu cuenta</span>
      </h1>
      <p class="auth-subtitle" style="text-align:left;margin-bottom:28px;" x-text="authMode === 'login' ? 'Inicia sesión para continuar.' : 'Tres campos y empezamos.'"></p>

      <div x-show="authError" class="auth-error" style="margin-bottom:12px;" x-text="authError"></div>

      <form class="auth-form" @submit.prevent="handleAuth">
        <input x-show="authMode === 'signup'" class="auth-input" type="text" placeholder="Nombre completo" x-model="authName" autocomplete="name">
        <input class="auth-input" type="email" placeholder="Email" x-model="authEmail" required autocomplete="email">
        <input class="auth-input" type="password" :placeholder="authMode === 'login' ? 'Contraseña' : 'Minimo 8 caracteres'" x-model="authPassword" required minlength="6" :autocomplete="authMode === 'login' ? 'current-password' : 'new-password'">
        <div x-show="authMode === 'signup' && authPassword.length > 0" style="display:flex;align-items:center;gap:8px;margin-top:-4px;">
          <div style="flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;">
            <div :style="'width:' + (authPassword.length >= 12 ? '100' : authPassword.length >= 8 ? '70' : authPassword.length >= 4 ? '40' : '15') + '%;height:100%;background:' + (authPassword.length >= 12 ? 'var(--success)' : authPassword.length >= 8 ? 'var(--success)' : authPassword.length >= 4 ? 'var(--warning)' : 'var(--danger)')"></div>
          </div>
          <span style="font-size:11px;font-weight:600;" :style="'color:' + (authPassword.length >= 8 ? 'var(--success)' : authPassword.length >= 4 ? 'var(--warning)' : 'var(--danger)')" x-text="authPassword.length >= 12 ? 'Excelente' : authPassword.length >= 8 ? 'Buena' : authPassword.length >= 4 ? 'Debil' : 'Muy corta'"></span>
        </div>
        <button class="auth-btn" type="submit" :disabled="authLoading">
          <span x-show="!authLoading" x-text="authMode === 'login' ? 'Iniciar sesión' : 'Crear cuenta'"></span>
          <span x-show="authLoading">Cargando...</span>
        </button>
        <button x-show="authMode === 'login'" type="button" class="auth-forgot" @click="tab = 'forgotpw'">Olvidé mi contraseña</button>
      </form>

      <div class="auth-divider" x-text="authMode === 'login' ? 'O CONTINUA CON' : 'O'"></div>

      <div style="width:100%;display:flex;gap:10px;">
        <button class="auth-oauth-btn" type="button" style="flex:1;opacity:0.45;cursor:not-allowed;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Proximamente
        </button>
      </div>

      <p class="auth-switch" style="margin-top:auto;padding-top:20px;padding-bottom:14px;">
        <span x-text="authMode === 'login' ? 'No tienes cuenta?' : 'Ya tienes cuenta?'"></span>
        <button @click="authMode = authMode === 'login' ? 'signup' : 'login'; authError = ''">
          <span x-text="authMode === 'login' ? 'Regístrate' : 'Iniciar sesión'"></span>
        </button>
      </p>
      <p style="font-size:12px;color:var(--dim);text-align:center;padding-bottom:14px;line-height:1.6;" x-show="authMode === 'signup'">
        Al crear tu cuenta aceptas la
        <a href="/privacidad.html" style="color:var(--cyan);text-decoration:underline;" target="_blank">política de privacidad</a> y los
        <a href="/terminos.html" style="color:var(--cyan);text-decoration:underline;" target="_blank">términos de servicio</a>.
      </p>
    </div>
  </template>

  <!-- ░░░ MAIN APP (authenticated) ░░░ -->
  <template x-if="user">
    <div style="display:flex;flex-direction:column;height:100%;">

      <!-- ══ HOME ══ -->
      <div class="main-content" x-show="tab === 'home'" x-cloak>
        <div class="page-header">
          <div class="ph-left">
            <div class="ph-title">Hola, <span x-text="userName"></span></div>
            <div class="ph-subtitle" x-text="todayLabel"></div>
          </div>
          <div class="ph-actions">
            <button class="ph-icon-btn" @click="tab = 'settings'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
            <button class="ph-icon-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
              <div class="notif-dot"></div>
            </button>
          </div>
        </div>

        <!-- Hero Card -->
        <div class="hero-card gradient-border glow">
          <div class="hero-top-row">
            <div class="hero-label" x-text="'GASTADO EN ' + currentMonthName.toUpperCase()"></div>
            <div class="hero-delta" :class="monthDelta >= 0 ? 'up' : 'down'">
              <span x-text="monthDelta >= 0 ? '↗' : '↘'" style="font-size:13px;"></span>
              <span x-text="(monthDelta >= 0 ? '+$' : '-$') + fmtMoney(Math.abs(monthDelta)) + ' vs mes anterior'"></span>
            </div>
          </div>
          <div class="hero-amount-row">
            <span class="hero-currency">$</span>
            <span class="hero-amount gradient-text" x-text="fmtMoney(monthTotal)"></span>
          </div>
          <div>
            <div class="hero-progress">
              <div class="hero-progress-fill" :style="'width:' + spentPct + '%'"></div>
              <div class="hero-progress-marker" :style="'left:' + monthPct + '%'"></div>
            </div>
            <div class="hero-progress-labels">
              <span x-text="spentPct + '% gastado'"></span>
              <span x-text="monthPct + '% del mes transcurrido'"></span>
            </div>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-card-label">ESTA SEMANA</div>
            <div class="stat-card-value mono" x-text="'$' + fmtMoney(weekTotal)"></div>
            <div class="stat-card-sub" x-text="weekExpenseCount + ' gastos'"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-label">CATEGORIA TOP</div>
            <div class="stat-card-value" x-text="topCategoryEmoji ? topCategoryEmoji + ' ' + topCategory : '—'"></div>
            <div class="stat-card-sub" x-text="topCategory ? '$' + fmtMoney(topCategoryAmount) + ' · ' + topCategoryPct + '%' : ''"></div>
          </div>
          <div class="stat-card" :class="{ locked: userPlan === 'free' }">
            <div class="stat-card-label">PRESUPUESTO</div>
            <div class="stat-card-value" :style="userPlan === 'free' ? 'color:var(--muted)' : (budgetTotalPct > 80 ? 'color:var(--warning)' : '')" x-text="userPlan === 'free' ? '—' : budgetTotalPct + '%'"></div>
            <div class="stat-card-sub" x-text="userPlan === 'free' ? 'Pro' : '$' + fmtMoney(monthTotal) + ' / ' + fmtMoney(budgetTotalAmount)"></div>
            <template x-if="userPlan === 'free'">
              <svg class="lock-icon" width="13" height="13" viewBox="0 0 14 14" fill="none">
                <rect x="2.5" y="6" width="9" height="6.5" rx="1.5" stroke="var(--cyan)" stroke-width="1.4"/>
                <path d="M4.5 6V4.5a2.5 2.5 0 015 0V6" stroke="var(--cyan)" stroke-width="1.4"/>
              </svg>
            </template>
          </div>
        </div>

        <!-- Budget alerts (compact, links to Presupuestos tab) -->
        <template x-for="alert in budgetAlerts" :key="alert.cat">
          <div class="budget-alert" :class="{ danger: alert.pct >= 100 }" @click="tab = 'budgets'" style="cursor:pointer;margin:0 20px 8px;">
            <span x-text="alert.pct >= 100 ? '🚨' : '⚠️'"></span>
            <span x-text="alert.label + ': ' + alert.pct + '%'"></span>
            <span style="margin-left:auto;font-size:11px;color:var(--cyan);">Ver →</span>
          </div>
        </template>

        <!-- Recent expenses -->
        <div class="section-head">
          <span class="section-title">Reciente</span>
          <button class="section-action" @click="tab = 'history'">Ver todo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
        </div>
        <div class="expense-list">
          <template x-for="exp in recentExpenses" :key="exp.id">
            <div class="expense-row" @click="openEdit(exp)">
              <div class="expense-icon" :style="'background:' + getCatColor(exp.category) + '15;border:1px solid ' + getCatColor(exp.category) + '30'">
                <span x-text="getCatEmoji(exp.category)"></span>
              </div>
              <div class="expense-info">
                <div class="expense-desc" x-text="exp.description || getCatLabel(exp.category)"></div>
                <div class="expense-meta" x-text="formatDate(exp.date)"></div>
              </div>
              <svg x-show="exp.receipt_image_path" class="receipt-indicator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
              <div class="expense-amount" :class="{ income: exp.is_income }" x-text="(exp.is_income ? '+' : '-') + '$' + fmtMoney(exp.amount)"></div>
            </div>
          </template>
          <template x-if="recentExpenses.length === 0">
            <div class="empty-state" style="padding:30px 28px;">
              <div class="empty-icon" style="width:100px;height:100px;border-radius:28px;background:radial-gradient(circle at 30% 30%, rgba(0,240,255,0.22), rgba(112,0,255,0.18) 60%, transparent 80%);border:1px solid var(--cyan);box-shadow:0 0 60px rgba(0,240,255,0.18);">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.6" width="48" height="48"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </div>
              <div class="empty-title">Registra tu <span class="gradient-text">primer gasto</span></div>
              <div class="empty-desc">Toca el botón <span style="color:var(--cyan);font-weight:700;">+</span> para empezar. En segundos, con texto, voz o foto.</div>
              <div style="margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--cyan);opacity:0.7;">
                <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;padding:4px 10px;border-radius:6px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);">EMPIEZA AQUI</div>
                <svg width="18" height="30" viewBox="0 0 18 30" fill="none"><path d="M9 2v22M3 20l6 6 6-6" stroke="var(--cyan)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/></svg>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- ══ HISTORY ══ -->
      <div class="main-content" x-show="tab === 'history'" x-cloak>
        <div class="page-header">
          <button @click="tab = 'home'" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="ph-left" style="margin-left:4px;">
            <div class="ph-title" style="font-size:20px;">Historial</div>
          </div>
        </div>

        <!-- Month nav -->
        <div class="month-nav">
          <button @click="prevMonth">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span x-text="historyMonthLabel"></span>
          <button @click="nextMonth">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Category filter chips -->
        <div class="filter-chips">
          <button class="chip" :class="{ active: filterCat === 'all' }" @click="filterCat = 'all'">Todos</button>
          <template x-for="cat in categories" :key="cat.key">
            <button class="chip" :class="{ active: filterCat === cat.key }" @click="filterCat = cat.key" x-text="cat.emoji + ' ' + cat.label"></button>
          </template>
        </div>

        <!-- Grouped expense list -->
        <template x-for="group in filteredHistoryGroups" :key="group.label">
          <div class="date-group">
            <div class="date-label">
              <span x-text="group.label"></span>
              <span class="mono" style="color:var(--muted);font-size:11px;" x-text="'$' + fmtMoney(group.total)"></span>
            </div>
            <div class="list-block">
              <template x-for="exp in group.items" :key="exp.id">
                <div class="expense-row" @click="openEdit(exp)">
                  <div class="expense-icon" :style="'background:' + getCatColor(exp.category) + '15;border:1px solid ' + getCatColor(exp.category) + '30'">
                    <span x-text="getCatEmoji(exp.category)"></span>
                  </div>
                  <div class="expense-info">
                    <div class="expense-desc" x-text="exp.description || getCatLabel(exp.category)"></div>
                    <div class="expense-meta" x-text="formatTime(exp.created_at)"></div>
                  </div>
                  <div class="expense-amount" :class="{ income: exp.is_income }" x-text="(exp.is_income ? '+' : '-') + '$' + fmtMoney(exp.amount)"></div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <div class="history-footer" x-show="historyExpenses.length > 0">
          <span x-text="historyExpenses.length + ' transacciónes'"></span>
          <span class="gradient-text mono" style="font-size:16px;font-weight:700;" x-text="'$' + fmtMoney(historyTotal)"></span>
        </div>
        <div x-show="historyExpenses.length === 0" style="text-align:center;padding:48px 20px;color:var(--dim);font-size:14px;">
          Sin transacciónes en este mes
        </div>
      </div>

      <!-- ══ COBROS ══ -->
      <div class="main-content" x-show="tab === 'cobros'" x-cloak>
        <div class="page-header">
          <div class="ph-left">
            <div class="ph-title">Cobros</div>
            <div class="ph-subtitle">Te deben dinero</div>
          </div>
          <div class="ph-actions">
            <button class="ph-icon-btn" @click="tab = 'settings'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
          </div>
        </div>

        <!-- Empty state -->
        <template x-if="pendingSplits.length === 0">
          <div class="empty-state">
            <div class="empty-icon" style="background:radial-gradient(circle at 35% 35%, rgba(112,0,255,0.18), rgba(0,240,255,0.10) 60%, transparent 80%);border:1px solid rgba(112,0,255,0.35);box-shadow:0 0 48px rgba(112,0,255,0.15);position:relative;">
              <svg viewBox="0 0 24 24" fill="none" stroke="#B794F6" stroke-width="1.6" width="48" height="48"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              <div style="position:absolute;bottom:-6px;right:-6px;width:32px;height:32px;border-radius:10px;background:var(--success);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3.2" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>
            <div class="empty-title">Sin cobros <span class="gradient-text">pendientes</span></div>
            <div class="empty-desc" style="margin-bottom:22px;">Cuando dividas un gasto, los cobros aparecen aqui automaticamente.</div>
            <button @click="openNew()" style="width:100%;max-width:280px;height:46px;border-radius:23px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Crear cobro manual
            </button>
          </div>
        </template>

        <!-- With data -->
        <template x-if="pendingSplits.length > 0">
          <div style="padding:0 20px;">
            <!-- Hero total with gradient border -->
            <div class="gradient-border glow" style="background:var(--surface);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 0 32px rgba(0,240,255,0.12), 0 0 64px rgba(112,0,255,0.08);">
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin-bottom:8px;">TE DEBEN</div>
              <div class="gradient-text mono" style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;" x-text="'$' + fmtMoney(pendingSplits.reduce((s,e) => s + e.split_pending, 0))"></div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
                <div style="display:flex;gap:4px;">
                  <template x-for="i in Math.min(pendingSplits.length, 5)" :key="i">
                    <div style="width:8px;height:8px;border-radius:4px;background:var(--warning);"></div>
                  </template>
                </div>
                <span style="font-size:12px;color:var(--dim);" x-text="pendingSplits.length + ' pendiente' + (pendingSplits.length > 1 ? 's' : '')"></span>
              </div>
            </div>

            <!-- Buscador -->
            <div style="margin-bottom:14px;position:relative;">
              <input type="text" x-model="cobrosSearch" placeholder="Buscar por persona..." style="width:100%;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--border);padding:0 16px 0 40px;font-size:14px;color:var(--text);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" width="16" height="16" style="position:absolute;left:14px;top:14px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>

            <!-- Nuevo cobro CTA -->
            <button @click="openNew()" style="width:100%;height:48px;border-radius:14px;border:1px dashed var(--cyan);background:var(--surface);color:var(--cyan);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nuevo cobro
            </button>

            <template x-for="(group, persona) in filteredSplitsByPersona" :key="persona">
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#0A0A0F;" x-text="persona[0].toUpperCase()"></div>
                    <span style="font-weight:600;font-size:15px;" x-text="persona"></span>
                  </div>
                  <div class="mono" style="color:var(--cyan);font-weight:700;font-size:15px;" x-text="'$' + fmtMoney(group.reduce((s,e) => s + e.split_pending, 0))"></div>
                </div>
                <template x-for="exp in group" :key="exp.id">
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--border);">
                    <div>
                      <div style="font-size:13px;font-weight:500;" x-text="exp.description || getCatLabel(exp.category)"></div>
                      <div style="font-size:11px;color:var(--dim);" x-text="formatDate(exp.date)"></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                      <span class="mono" style="font-size:13px;color:var(--muted);" x-text="'$' + fmtMoney(exp.split_pending)"></span>
                      <button @click="markSplitPaid(exp.id)" style="background:rgba(0,229,160,0.15);color:var(--success);padding:5px 10px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;">COBRADO</button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- ══ PRESUPUESTOS TAB ══ -->
      <div class="main-content" x-show="tab === 'budgets'" x-cloak>
        <div class="page-header">
          <div class="ph-left">
            <div class="ph-title">Presupuestos</div>
            <div class="ph-subtitle" x-text="currentMonthLabel"></div>
          </div>
          <div class="ph-actions">
            <button class="ph-icon-btn" @click="budgetSheetOpen = true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="ph-icon-btn" @click="tab = 'settings'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
          </div>
        </div>

        <!-- Global budget -->
        <template x-if="budgets.length > 0">
          <div style="padding:0 20px;">
            <template x-if="totalBudgetObj">
              <div style="background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:20px;margin-bottom:18px;">
                <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin-bottom:6px;">GASTADO TOTAL</div>
                <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;">
                  <span class="gradient-text mono" style="font-size:32px;font-weight:800;letter-spacing:-1px;" x-text="'$' + fmtMoney(monthTotal)"></span>
                  <span style="font-size:14px;color:var(--dim);" x-text="'/ $' + fmtMoney(totalBudgetObj.amount)"></span>
                </div>
                <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">
                  RESTANTE: <span style="color:var(--success);font-weight:700;" x-text="'$' + fmtMoney(Math.max(0, totalBudgetObj.amount - monthTotal))"></span>
                </div>
                <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:6px;">
                  <div style="height:100%;border-radius:4px;transition:width 0.4s;" :style="'width:' + Math.min(totalBudgetPct, 100) + '%;background:' + (totalBudgetPct >= 100 ? 'var(--danger)' : totalBudgetPct >= 80 ? 'var(--warning)' : 'var(--gradient)')"></div>
                </div>
                <div style="font-size:11px;color:var(--dim);" x-text="totalBudgetPct + '% usado'"></div>
              </div>
            </template>

            <!-- Per-category -->
            <template x-for="b in budgetBars" :key="b.cat">
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;" :style="'background:' + (b.color || 'var(--border)') + '18;border:1px solid ' + (b.color || 'var(--border)') + '30'">
                    <span x-text="b.emoji"></span>
                  </div>
                  <div style="flex:1;min-width:0;">
                    <div style="font-size:14px;font-weight:600;" x-text="b.label"></div>
                    <div class="mono" style="font-size:11px;color:var(--muted);margin-top:1px;" x-text="'$' + fmtMoney(b.spent) + ' / $' + fmtMoney(b.budget)"></div>
                  </div>
                  <div style="font-size:16px;font-weight:700;" :style="'color:' + (b.pct >= 100 ? 'var(--danger)' : b.pct >= 80 ? 'var(--warning)' : 'var(--text)')" x-text="b.pct + '%'"></div>
                </div>
                <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
                  <div style="height:100%;border-radius:3px;transition:width 0.4s;" :style="'width:' + Math.min(b.pct, 100) + '%;background:' + (b.pct >= 100 ? 'var(--danger)' : b.pct >= 80 ? 'var(--warning)' : b.color || 'var(--cyan)')"></div>
                </div>
                <div style="display:flex;gap:4px;margin-top:8px;">

      <!-- ══ PLANS ══ -->

        <div class="page-header">
          <button @click="tab = 'settings'" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>

          </div>

                  <span x-show="p.key === 'elite'" style="font-size:10px;color:var(--warning);font-weight:700;background:rgba(255,184,0,0.12);padding:3px 8px;border-radius:6px;">POPULAR</span>

          <!-- FAQ -->

            <div style="font-size:12px;color:var(--muted);line-height:1.6;">

        </div>

      <!-- ══ CHECKOUT ══ -->

            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#1A1F71;letter-spacing:0.6px;">VISA</span>
            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#EB001B;letter-spacing:0.6px;">MC</span>
            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#0079BE;letter-spacing:0.6px;">DINERS</span>
          </div>
        </div>

        <div class="pay-spinner">

          <div class="arc"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:32px;background:linear-gradient(135deg, rgba(0,240,255,0.18), rgba(112,0,255,0.18));border:1px solid rgba(0,240,255,0.35);display:flex;align-items:center;justify-content:center;">

          </div>
        </div>
        <div style="font-size:24px;font-weight:700;letter-spacing:-0.6px;margin-bottom:10px;text-align:center;">

          <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.9" width="48" height="48"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

        <div style="width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,107,107,0.05);border:1px solid rgba(255,107,107,0.25);text-align:left;margin-bottom:20px;">
