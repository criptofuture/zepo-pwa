              <div class="cd-cat-pill" :style="'background:' + c.color + '12;border:1px solid ' + c.color + '30'">
                <span style="font-size:13px;" x-text="c.emoji"></span><span x-text="c.label"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.5" width="10" height="10" style="margin-left:2px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </div>
            </template>
            <div style="padding:7px 10px;border-radius:9px;font-size:12px;font-weight:600;background:transparent;border:1px dashed var(--cyan);color:var(--cyan);display:flex;align-items:center;gap:6px;cursor:pointer;">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.5" width="10" height="10"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Agregar
            </div>
          </div>
        </div>

        <!-- Presupuestos -->
        <div class="settings-group-title">Presupuestos</div>
        <div class="settings-group" style="padding:0;">
          <template x-if="budgets.length === 0">
            <div style="padding:20px 14px;text-align:center;color:var(--dim);font-size:13px;">
              No tienes presupuestos configurados
            </div>
          </template>
          <template x-for="(b, bi) in budgetBars" :key="b.cat">
            <div :style="'padding:14px;' + (bi < budgetBars.length - 1 ? 'border-bottom:1px solid var(--border)' : '')">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;" :style="'background:' + b.color + '18;border:1px solid ' + b.color + '30'">
                  <span x-text="b.emoji"></span>
                </div>
                <div style="flex:1;font-size:14px;font-weight:600;" x-text="b.label"></div>
                <div style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;">
                  <span style="color:var(--text);font-weight:700;" x-text="'$' + fmtMoney(b.spent)"></span> / $<span x-text="fmtMoney(b.budget)"></span>
                </div>
              </div>
              <div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
                <div :style="'height:100%;border-radius:3px;width:' + Math.min(b.pct, 100) + '%;background:' + (b.pct >= 90 ? 'var(--danger)' : b.pct >= 70 ? 'var(--warning)' : 'var(--success)')"></div>
              </div>
              <div style="display:flex;gap:4px;margin-top:8px;">
                <template x-for="a in [50, 75, 90]" :key="a">
                  <div :style="b.pct >= a ? 'background:rgba(255,184,0,0.15);color:var(--warning);border:1px solid rgba(255,184,0,0.3)' : 'background:var(--bg);color:var(--dim);border:1px solid var(--border)'" style="padding:3px 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:0.4px;" x-text="a + '%'"></div>
                </template>
              </div>
            </div>
          </template>
          <div @click="budgetSheetOpen = true" style="padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--cyan);font-weight:600;font-size:13px;cursor:pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Agregar presupuesto
          </div>
        </div>

        <!-- Notificaciones -->
        <div class="settings-group-title">Notificaciones</div>
        <div class="settings-group">
          <div class="settings-item" @click="notifDaily = !notifDaily" style="cursor:pointer;">
            <span class="si-label">Recordatorio diario</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto;margin-right:10px;">21:00</span>
            <div class="cd-toggle" :class="{ on: notifDaily }">
              <div class="cd-toggle-knob"></div>
            </div>
          </div>
          <div class="settings-item" @click="notifBudget = !notifBudget" style="cursor:pointer;">
            <span class="si-label">Alertas de presupuesto</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto;margin-right:10px;" x-text="budgetAlertThresholds.join('% · ') + '%'"></span>
            <div class="cd-toggle" :class="{ on: notifBudget }">
              <div class="cd-toggle-knob"></div>
            </div>
          </div>
          <div class="settings-item" @click="notifWeekly = !notifWeekly" style="cursor:pointer;">
            <span class="si-label">Resumen semanal</span>
            <div class="cd-toggle" :class="{ on: notifWeekly }" style="margin-left:auto;">
              <div class="cd-toggle-knob"></div>
            </div>
          </div>
        </div>

        <!-- Data -->
        <div class="settings-group-title">Datos</div>
        <div class="settings-group">
          <button class="settings-item" @click="exportExcel">
            <div class="si-icon" style="background:rgba(0,229,160,0.1);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <span class="si-label">Exportar Excel</span>
          </button>
          <button class="settings-item" @click="exportData">
            <div class="si-icon" style="background:rgba(0,240,255,0.1);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <span class="si-label">Exportar CSV</span>
          </button>
        </div>

        <!-- Account -->
        <div class="settings-group-title">Cuenta</div>
        <div class="settings-group">
          <button class="settings-item" @click="tab = 'changepass'">
            <div class="si-icon" style="background:rgba(0,240,255,0.1);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
            <span class="si-label">Cambiar contraseña</span>
            <svg class="si-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="settings-item danger" @click="handleLogout">
            <div class="si-icon" style="background:rgba(255,107,107,0.12);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
            <span class="si-label">Cerrar sesión</span>
          </button>
          <button class="settings-item danger" @click="showDeleteModal = true">
            <div class="si-icon" style="background:rgba(255,107,107,0.12);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </div>
            <span class="si-label">Eliminar mi cuenta</span>
          </button>
        </div>

        <div style="text-align:center;padding:24px 20px;font-size:11px;color:var(--dim);">
          Zepo v1.0 · Hecho por <span class="gradient-text" style="font-weight:600;">Lynoia</span>
        </div>
      </div>

      <!-- ══ CHANGE PASSWORD ══ -->
      <div class="main-content" x-show="tab === 'changepass'" x-cloak>
        <div class="page-header">
          <button @click="tab = 'settings'" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="ph-left" style="margin-left:4px;">
            <div class="ph-title" style="font-size:20px;">Cambiar contraseña</div>
          </div>
        </div>

        <div style="padding:0 24px;">
          <div style="display:flex;justify-content:center;margin-bottom:20px;">
            <div style="width:56px;height:56px;border-radius:16px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(0,240,255,0.12);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.8" width="26" height="26"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
          </div>
          <p style="font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:22px;text-align:center;">
            Para tu seguridad, ingresa tu contraseña actual antes de definir una nueva.
          </p>

          <div class="field-label">Contraseña actual</div>
          <input class="field-input" type="password" x-model="pwForm.current" placeholder="Tu contraseña actual" style="font-family:'JetBrains Mono',monospace;">

          <div class="field-label">Nueva contraseña</div>
          <input class="field-input" type="password" x-model="pwForm.newPw" placeholder="Minimo 6 caracteres" style="font-family:'JetBrains Mono',monospace;">

          <div class="field-label">Confirmar nueva contraseña</div>
          <input class="field-input" type="password" x-model="pwForm.confirm" placeholder="Repite la nueva contraseña" style="font-family:'JetBrains Mono',monospace;">

          <!-- Strength indicator -->
          <div x-show="pwForm.newPw" style="margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="flex:1;display:flex;gap:3px;">
                <template x-for="i in 4" :key="i">
                  <div style="flex:1;height:4px;border-radius:2px;" :style="'background:' + (i <= pwStrength.level ? pwStrength.color : 'var(--border)')"></div>
                </template>
              </div>
              <span style="font-size:11px;font-weight:700;letter-spacing:0.4px;" :style="'color:' + pwStrength.color" x-text="pwStrength.label"></span>
            </div>
          </div>

          <button class="save-btn" @click="changePassword" :disabled="!pwForm.current || !pwForm.newPw || pwForm.newPw !== pwForm.confirm || pwForm.newPw.length < 6 || changingPw">
            <span x-show="!changingPw">Actualizar contraseña</span>
            <span x-show="changingPw">Actualizando...</span>
          </button>

          <div style="margin-top:18px;text-align:center;">
            <button @click="tab = 'forgotpw'" style="font-size:12px;color:var(--cyan);font-weight:600;">Olvidé la actual</button>
          </div>
        </div>
      </div>

      <!-- ══ FORGOT PASSWORD ══ -->
      <div class="main-content" x-show="tab === 'forgotpw'" x-cloak>
        <div class="page-header">
          <button @click="tab = user ? 'changepass' : 'auth'; forgotEmail = ''; forgotSent = false" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="ph-left" style="margin-left:4px;">
            <div class="ph-title" style="font-size:20px;">Recuperar contraseña</div>
          </div>
        </div>

        <div style="padding:0 24px;">
          <!-- Form state -->
          <div x-show="!forgotSent">
            <div style="display:flex;justify-content:center;margin-bottom:20px;">
              <div style="width:56px;height:56px;border-radius:16px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.3);display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(0,240,255,0.12);">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.8" width="26" height="26"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
            </div>
            <p style="font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:22px;text-align:center;">
              Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <div class="field-label">Email</div>
            <input class="field-input" type="email" x-model="forgotEmail" placeholder="tu@email.com" autocomplete="email" style="font-family:'JetBrains Mono',monospace;">

            <button class="save-btn" style="margin-top:20px;" @click="sendPasswordReset" :disabled="!forgotEmail || forgotLoading">
              <span x-show="!forgotLoading">Enviar enlace</span>
              <span x-show="forgotLoading">Enviando...</span>
            </button>
          </div>

          <!-- Success state -->
          <div x-show="forgotSent" style="text-align:center;padding:32px 0;">
            <div style="width:72px;height:72px;border-radius:20px;background:rgba(0,229,160,0.12);border:1px solid rgba(0,229,160,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 32px rgba(0,229,160,0.15);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.2" width="32" height="32"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div style="font-size:22px;font-weight:800;margin-bottom:10px;">Revisa tu email</div>
            <div style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:28px;">
              Te enviamos un enlace a <span style="color:var(--text);font-weight:600;" x-text="forgotEmail"></span> para restablecer tu contraseña.
            </div>
            <button class="save-btn" @click="tab = user ? 'settings' : 'auth'; forgotEmail = ''; forgotSent = false">
              <span x-text="user ? 'Volver a configuración' : 'Volver al login'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- ══ PLANS ══ -->
      <div class="main-content" x-show="tab === 'plans'" x-cloak>
        <div class="page-header">
          <button @click="tab = 'settings'" style="width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="ph-left" style="margin-left:4px;">
            <div class="ph-title" style="font-size:20px;">Planes</div>
          </div>
        </div>

        <div style="padding:0 20px;">
          <!-- Hero -->
          <div style="margin-bottom:20px;">
            <div style="font-size:28px;font-weight:700;letter-spacing:-0.8px;line-height:1.15;margin-bottom:6px;">
              Tu dinero, <span class="gradient-text">claro.</span>
            </div>
            <div style="font-size:14px;color:var(--muted);line-height:1.4;">
              Empieza gratis. Mejora cuando tu vida financiera se vuelva interesante.
            </div>
          </div>

          <!-- Mensual / Anual toggle -->
          <div style="display:flex;background:var(--surface);border-radius:11px;padding:4px;border:1px solid var(--border);margin-bottom:18px;position:relative;">
            <div @click="annualBilling = false" :style="!annualBilling ? 'background:var(--bg);color:var(--text)' : 'background:transparent;color:var(--muted)'" style="flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;">Mensual</div>
            <div @click="annualBilling = true" :style="annualBilling ? 'background:var(--bg);color:var(--text)' : 'background:transparent;color:var(--muted)'" style="flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all 0.15s;">
              Anual
              <span style="font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;background:rgba(0,229,160,0.2);color:var(--success);letter-spacing:0.4px;">−2 MESES</span>
            </div>
          </div>

          <!-- Promo banner -->
          <div style="margin-bottom:16px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg, rgba(0,240,255,0.10), rgba(112,0,255,0.10));border:1px solid rgba(0,240,255,0.3);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
              <span style="font-size:18px;">🎁</span>
              <div style="font-size:13px;font-weight:700;color:var(--text);">Precio fundador · 50% OFF</div>
            </div>
            <div style="font-size:11px;color:var(--muted);line-height:1.5;">
              Si contratas antes del <strong style="color:var(--text);">31 dic 2026</strong>, mantienes este precio <strong class="gradient-text">para siempre</strong>.
            </div>
          </div>

          <!-- Plan cards -->
          <template x-for="p in planOptions" :key="p.key">
            <div style="margin-bottom:12px;" :style="p.gradient ? 'padding:1.5px;border-radius:18px;background:var(--gradient);box-shadow:0 0 32px rgba(112,0,255,0.18)' : ''">
              <div :style="p.gradient ? 'border-radius:16.5px;background:linear-gradient(160deg, rgba(0,240,255,0.06) 0%, rgba(112,0,255,0.08) 100%)' : 'border-radius:18px;background:var(--surface);border:1px solid ' + (p.highlight && !p.gradient ? 'var(--cyan)' : 'var(--border)') + ';' + (p.highlight && !p.gradient ? 'box-shadow:0 0 0 3px rgba(0,240,255,0.06)' : '')">
                <div style="padding:20px 18px;">
                  <!-- Header row -->
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:10px;">
                    <div style="min-width:0;flex:1;">
                      <div style="font-size:13px;color:var(--muted);font-weight:600;" x-text="p.tagline"></div>
                      <div style="font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-top:2px;display:flex;align-items:center;gap:8px;">
                        <span x-text="p.label.charAt(0) + p.label.slice(1).toLowerCase()"></span>
                        <span x-show="p.key === userPlan" style="font-size:10px;color:var(--success);font-weight:700;background:rgba(0,229,160,0.12);padding:3px 8px;border-radius:6px;letter-spacing:0.4px;">ACTUAL</span>
                      </div>
                    </div>
                    <template x-if="p.warning">
                      <span style="font-size:9px;font-weight:700;padding:4px 8px;border-radius:5px;background:rgba(255,184,0,0.18);color:var(--warning);letter-spacing:0.6px;white-space:nowrap;" x-text="p.warning.toUpperCase()"></span>
                    </template>
                    <template x-if="p.highlight && !p.warning">
                      <span :style="p.gradient ? 'background:var(--gradient);color:#0A0A0F' : 'background:rgba(0,240,255,0.10);color:var(--cyan)'" style="font-size:9px;font-weight:700;padding:4px 8px;border-radius:5px;letter-spacing:0.6px;white-space:nowrap;" x-text="p.highlight"></span>
                    </template>
                  </div>

                  <!-- Price -->
                  <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:16px;">
                    <span class="gradient-text" style="font-size:36px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;" x-text="'$' + p.price"></span>
                    <span style="font-size:14px;color:var(--muted);font-weight:500;" x-text="p.period"></span>
                    <span x-show="p.priceRegular !== p.price && p.price !== '0.00'" style="font-size:13px;color:var(--dim);text-decoration:line-through;margin-left:6px;font-variant-numeric:tabular-nums;" x-text="'$' + p.priceRegular"></span>
                  </div>

                  <!-- Features list -->
                  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
                    <template x-for="(f, fi) in p.features" :key="fi">
                      <div style="display:flex;align-items:center;gap:10px;font-size:13px;" :style="f.v ? 'color:var(--text)' : 'color:var(--dim)'">
                        <template x-if="f.v">
                          <div style="width:18px;height:18px;border-radius:9px;background:rgba(0,240,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="3" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>
                          </div>
                        </template>
                        <template x-if="!f.v">
                          <div style="width:18px;height:18px;border-radius:9px;opacity:0.4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2.5" width="11" height="11"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                          </div>
                        </template>
                        <span x-text="f.l"></span>
                      </div>
                    </template>
                  </div>

                  <!-- CTA -->
                  <template x-if="p.key === userPlan">
                    <button style="width:100%;height:46px;border-radius:23px;background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="3" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>
                      Plan actual
                    </button>
                  </template>
                  <template x-if="p.key !== userPlan && p.key !== 'free'">
                    <button @click="startCheckout(p.key)" style="width:100%;height:46px;border-radius:23px;background:var(--gradient);color:#0A0A0F;font-weight:700;font-size:14px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,240,255,0.18);" x-text="'Mejorar a ' + (p.label.charAt(0) + p.label.slice(1).toLowerCase())"></button>
                  </template>
                  <template x-if="p.key === 'free' && userPlan !== 'free'">
                    <button style="width:100%;height:46px;border-radius:23px;background:transparent;border:1px solid var(--border);color:var(--muted);font-weight:600;font-size:13px;">Disponible siempre</button>
                  </template>
                </div>
              </div>

                <span style="font-size:13px;color:var(--muted);">/mes</span>

          <!-- Payment summary -->

                <span style="color:var(--muted);">Impuesto</span>

              </div>
              <div class="checkout-row total">

            <span x-show="paymentLoading">Conectando...</span>
          </button>

          <div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(0,240,255,0.04);border:1px solid rgba(0,240,255,0.15);display:flex;align-items:flex-start;gap:8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="12" height="12" style="margin-top:2px;flex-shrink:0;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <div style="font-size:11px;color:var(--muted);line-height:1.5;">
              Pago seguro procesado por <span style="color:var(--cyan);font-weight:700;">PayPhone</span>.
              Cancela cuando quieras desde tu perfil.
            </div>
          </div>

          <!-- Accepted cards -->
          <div style="margin-top:18px;display:flex;align-items:center;gap:8px;justify-content:center;">
            <span style="font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:600;">ACEPTAMOS</span>
            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#1A1F71;letter-spacing:0.6px;">VISA</span>
            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#EB001B;letter-spacing:0.6px;">MC</span>
            <span style="padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:9px;font-weight:800;color:#0079BE;letter-spacing:0.6px;">DINERS</span>
          </div>
        </div>
      </div>

      <!-- ══ PAYMENT PROCESSING ══ -->
      <div x-show="tab === 'pay-processing'" x-cloak style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;background:radial-gradient(circle at 50% 35%, rgba(0,240,255,0.10) 0%, transparent 60%);">
        <div class="pay-spinner">
          <div class="track"></div>
          <div class="arc"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:32px;background:linear-gradient(135deg, rgba(0,240,255,0.18), rgba(112,0,255,0.18));border:1px solid rgba(0,240,255,0.35);display:flex;align-items:center;justify-content:center;">
            <span class="gradient-text" style="font-size:28px;font-weight:800;">Z</span>
          </div>
        </div>
        <div style="font-size:24px;font-weight:700;letter-spacing:-0.6px;margin-bottom:10px;text-align:center;">
          Procesando tu <span class="gradient-text">pago...</span>
        </div>
        <div style="font-size:14px;color:var(--muted);line-height:1.5;text-align:center;max-width:280px;">
          Estamos confirmando con PayPhone. No cierres la app.
        </div>
      </div>

      <!-- ══ PAYMENT SUCCESS ══ -->
      <div x-show="tab === 'pay-success'" x-cloak style="flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 28px 32px;text-align:center;background:radial-gradient(circle at 50% 25%, rgba(0,229,160,0.18) 0%, transparent 55%);">
        <div style="width:108px;height:108px;border-radius:28px;background:linear-gradient(135deg, rgba(0,229,160,0.22), rgba(0,240,255,0.12));border:1px solid var(--success);display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 0 64px rgba(0,229,160,0.35);position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.6" width="52" height="52"><polyline points="20 6 9 17 4 12"/></svg>
          <div style="position:absolute;inset:-10px;border-radius:38px;border:1px solid rgba(0,229,160,0.3);"></div>
        </div>
        <div style="font-size:30px;font-weight:700;letter-spacing:-0.9px;margin-bottom:10px;">
          Bienvenido a <span class="gradient-text" x-text="checkoutPlan === 'elite' ? 'Elite!' : 'Pro!'"></span>
        </div>
        <div style="font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:28px;max-width:320px;">
          Tu plan esta activo. Disfruta todas las funciones.
        </div>
        <div style="width:100%;flex:1;"></div>
        <button class="save-btn" @click="tab = 'home'" style="width:100%;">Empezar a usar</button>
      </div>

      <!-- ══ PAYMENT FAILED ══ -->
      <div x-show="tab === 'pay-failed'" x-cloak style="flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 28px 32px;text-align:center;background:radial-gradient(circle at 50% 25%, rgba(255,107,107,0.18) 0%, transparent 55%);">
        <div style="width:108px;height:108px;border-radius:28px;background:linear-gradient(135deg, rgba(255,107,107,0.22), rgba(255,184,0,0.10));border:1px solid var(--danger);display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 0 64px rgba(255,107,107,0.3);">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.9" width="48" height="48"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div style="font-size:26px;font-weight:700;letter-spacing:-0.7px;margin-bottom:10px;">No se pudo procesar</div>
        <div style="font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:22px;max-width:320px;">
          Revisa los datos de tu tarjeta o intenta con otro metodo de pago.
        </div>
        <div style="width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,107,107,0.05);border:1px solid rgba(255,107,107,0.25);text-align:left;margin-bottom:20px;">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px;">Tarjeta rechazada</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.5;" x-text="paymentError || 'Tu banco rechazo el cargo. No se realizo ningun cobro.'"></div>
        </div>
        <div style="width:100%;flex:1;"></div>
        <button class="save-btn" @click="tab = 'checkout'" style="width:100%;">Reintentar pago</button>
        <button @click="tab = 'plans'" style="margin-top:10px;width:100%;height:46px;border-radius:23px;color:var(--muted);font-weight:600;font-size:14px;">Volver a planes</button>
      </div>

      <!-- ══ DELETE ACCOUNT MODAL ══ -->
      <template x-if="showDeleteModal">
        <div class="modal-overlay" @click.self="showDeleteModal = false">
          <div class="modal-card" style="box-shadow:0 20px 80px rgba(255,107,107,0.18), 0 0 0 1px rgba(255,107,107,0.15);">
            <div style="width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg, rgba(255,107,107,0.18), rgba(255,184,0,0.10));border:1px solid var(--danger);display:flex;align-items:center;justify-content:center;box-shadow:0 0 32px rgba(255,107,107,0.25);">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.8" width="30" height="30"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div style="font-size:22px;font-weight:700;letter-spacing:-0.5px;text-align:center;margin-bottom:10px;">¿Eliminar tu cuenta?</div>
            <div style="font-size:13px;color:var(--muted);line-height:1.55;text-align:center;margin-bottom:18px;">
              Se eliminarán todos tus datos permanentemente:
              <br><span style="color:var(--text);font-weight:600;" x-text="expenses.length + ' gastos · ' + pendingSplits.length + ' cobros'"></span>.
              <br>Esta acción no se puede deshacer.
            </div>
            <div style="margin-bottom:6px;">
              <div style="font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:600;margin-bottom:6px;">
                ESCRIBE <span style="color:var(--danger);font-family:'JetBrains Mono',monospace;">ELIMINAR</span> PARA CONFIRMAR
              </div>
              <input class="field-input" type="text" x-model="deleteConfirmText" placeholder="ELIMINAR" style="font-family:'JetBrains Mono',monospace;letter-spacing:1.2px;margin-bottom:0;">
            </div>
            <button @click="confirmDeleteAccount" :disabled="deleteConfirmText !== 'ELIMINAR'" style="margin-top:18px;width:100%;height:50px;border-radius:25px;background:rgba(255,107,107,0.15);border:1px solid rgba(255,107,107,0.3);color:var(--danger);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;" :style="deleteConfirmText !== 'ELIMINAR' ? 'opacity:0.55' : ''">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="15" height="15"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              Eliminar mi cuenta
            </button>
            <button @click="showDeleteModal = false; deleteConfirmText = ''" style="margin-top:8px;width:100%;height:46px;border-radius:23px;color:var(--muted);font-weight:600;font-size:14px;">Cancelar</button>
          </div>
        </div>
      </template>

      <!-- ══ TAB BAR ══ -->
      <nav class="tab-bar">
        <button class="tab-item" :class="{ active: tab === 'home' || tab === 'history' }" @click="tab = 'home'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          Inicio
        </button>
        <button class="tab-item" :class="{ active: tab === 'budgets' }" @click="tab = 'budgets'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Presup.
        </button>
        <div style="width:64px"></div>
        <button class="tab-item" :class="{ active: tab === 'cobros' }" @click="tab = 'cobros'; loadSplits()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Cobros
        </button>
        <button class="tab-item" :class="{ active: tab === 'dash' }" @click="tab = 'dash'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          Dash
        </button>
      </nav>

      <!-- ══ FAB ══ -->
      <button class="fab" @click="openNew" x-show="!sheetOpen">
        <svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>

      <!-- ══ INPUT / EDIT SHEET (Full-screen Approve) ══ -->
      <template x-if="sheetOpen">
        <div>
          <div class="approve-screen">
            <!-- Sticky header -->
            <div class="approve-header">
              <button class="approve-back" @click="sheetOpen = false">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </button>
              <div class="approve-title" x-text="editingExpense ? 'Editar gasto' : 'Aprobar registro'"></div>
              <div class="source-badge" x-show="!editingExpense"
                   x-text="inputMode.toUpperCase()"></div>
            </div>

            <!-- Main content area -->
            <div style="padding:0 20px 32px;">

              <!-- 4 Input mode tabs (CD style with lock icons) -->
              <div :style="editingExpense ? 'display:none' : 'display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;'">
                <button class="sheet-tab-v2" :class="{ active: inputMode === 'texto' }" @click="inputMode = 'texto'; voiceRecording && toggleVoice()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Texto
                </button>
                <button class="sheet-tab-v2" :class="{ active: inputMode === 'voz' }" @click="if (userPlan === 'free') { tab = 'plans'; sheetOpen = false; return } inputMode = 'voz'; voiceRecording && toggleVoice()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/></svg>
                  Voz
                  <svg x-show="userPlan === 'free'" class="lock" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </button>
                <button class="sheet-tab-v2" :class="{ active: inputMode === 'foto' }" @click="if (userPlan !== 'elite') { tab = 'plans'; sheetOpen = false; return } inputMode = 'foto'">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  Foto
                  <svg x-show="userPlan !== 'elite'" class="lock" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </button>
                <button class="sheet-tab-v2" :class="{ active: inputMode === 'archivo' }" @click="if (userPlan !== 'elite') { tab = 'plans'; sheetOpen = false; return } inputMode = 'archivo'">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                  Archivo
                  <svg x-show="userPlan !== 'elite'" class="lock" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </button>
              </div>

              <!-- TEXTO MODE — CD: Describe → Analizar → DETECTADO -->
              <div x-show="inputMode === 'texto' && !editingExpense" style="margin-bottom:14px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  <div style="font-size:14px;font-weight:700;letter-spacing:-0.2px;">Describe tu gasto</div>
                </div>

                <div class="cd-describe-card">
                  <textarea x-model="form.description" maxlength="500" rows="3" placeholder="almuerzo 15 dividido con juan · taxi al aeropuerto 8.50 · café 3.20"></textarea>

                </div>

                <button class="cd-analyze-btn" style="margin-top:12px;" @click="analyzeTextInput()" :disabled="analyzing || !form.description || form.description.length < 3">
                  <template x-if="!analyzing">
                    <span style="display:inline-flex;align-items:center;gap:8px;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      Analizar
                    </span>
                  </template>
                  <span x-show="analyzing">Analizando…</span>
                </button>

                <div x-show="analyzed && form.amount" style="margin-top:18px;">

                      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">

                              <span x-text="c.emoji"></span>
                            </div>
                          </template>
                          <div style="min-width:0;">
                            <template x-for="c in (form.is_income ? incomeCategories : categories)" :key="c.key">
                              <div x-show="c.key === form.category" style="font-size:13px;font-weight:600;" x-text="c.label"></div>
                            </template>
                            <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;" x-text="form.description"></div>
                          </div>
                        </div>
                        <div class="gradient-text" style="font-size:22px;font-weight:800;letter-spacing:-0.8px;font-variant-numeric:tabular-nums;" x-text="'$' + parseFloat(form.amount || 0).toFixed(2)"></div>
                      </div>
                      <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <div class="cd-meta-chip">
                          <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="10" height="10"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                          <span x-text="form.date === new Date().toISOString().slice(0,10) ? 'Hoy' : form.date"></span>
                        </div>
                        <div class="cd-meta-chip">
                          <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="10" height="10"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                          <span x-text="userCurrency"></span>
                        </div>
                        <div x-show="form.is_split" class="cd-meta-chip">
                          <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="10" height="10"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                          Dividido
                        </div>
                      </div>
                      <div style="margin-top:10px;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" width="10" height="10"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        Toca cualquier campo abajo para editar
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- VOZ MODE — CD: concentric waveform circles + transcript + bars -->
              <div x-show="inputMode === 'voz' && !editingExpense" style="margin-bottom:18px;">
                <div class="cd-voice-wrap" :class="{ 'cd-voice-recording': voiceRecording }">
                  <div style="font-size:13px;color:var(--muted);font-weight:500;" x-text="voiceRecording ? 'Habla ahora…' : 'Toca el micrófono para empezar'"></div>

                  <div class="cd-voice-circles">
                    <div class="ring r1"></div>
                    <div class="ring r2"></div>
                    <div class="ring r3"></div>
                    <div class="ring r4"></div>
                    <button class="cd-voice-mic" @click="toggleVoice">
                      <template x-if="!voiceRecording">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="2.4" width="32" height="32"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                      </template>
                      <template x-if="voiceRecording">
                        <svg viewBox="0 0 24 24" fill="var(--danger)" width="28" height="28"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                      </template>
                    </button>
                  </div>

                  <div x-show="voiceTranscript || voiceRecording" style="width:100%;padding:0 22px;margin-top:30px;">
                    <div style="font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:600;text-align:center;">TRANSCRIPCIÓN</div>
                    <div class="cd-voice-transcript" style="margin-top:8px;" x-text="voiceTranscript || (voiceRecording ? 'Escuchando…' : '')"></div>
                  </div>

                  <div x-show="voiceRecording" class="cd-voice-wave" style="margin-top:22px;">
                    <template x-for="h in [12,18,8,28,14,32,10,22,36,16,24,12,28,18,10,14,22,16,8,20]" :key="h+''+Math.random()">
                      <div class="cd-voice-wave-bar" :style="'height:' + h + 'px;opacity:' + (0.5 + h/80)"></div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- FOTO MODE — CD: receipt placeholder w/ scan line + extracted fields -->
              <div x-show="inputMode === 'foto' && !editingExpense" style="margin-bottom:18px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="16" height="16"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  <div style="font-size:14px;font-weight:700;">Foto del recibo</div>
                  <span class="plan-badge elite" style="font-size:9px;">ELITE</span>
                </div>

                <!-- Capture: no photo yet -->
                <template x-if="!receiptPreview">
                  <label style="display:block;cursor:pointer;">
                    <div class="cd-receipt-placeholder">
                      <div class="cd-receipt-bracket tl"></div>
                      <div class="cd-receipt-bracket tr"></div>
                      <div class="cd-receipt-bracket bl"></div>
                      <div class="cd-receipt-bracket br"></div>
                      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:10px;">
                        <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg, rgba(0,240,255,0.12), rgba(112,0,255,0.10));border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(0,240,255,0.15);">
                          <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.8" width="26" height="26"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </div>
                        <div style="font-size:14px;font-weight:700;color:var(--text);">Tomar foto del recibo</div>
                        <div style="font-size:11px;color:var(--muted);line-height:1.4;">Detectamos comercio, monto, fecha e items automáticamente</div>
                      </div>
                    </div>
                    <input type="file" accept="image/*" capture="environment" @change="handlePhoto($event)" style="display:none">
                  </label>
                </template>

                <!-- Analyzing: photo loaded -->
                <template x-if="receiptPreview">
                  <div>
                    <div class="cd-receipt-placeholder" style="background:none;padding:0;border:none;">
                      <img :src="receiptPreview" alt="Recibo" style="width:100%;height:100%;object-fit:cover;border-radius:16px;border:1px solid var(--border);">
                      <div class="cd-receipt-bracket tl"></div>
                      <div class="cd-receipt-bracket tr"></div>
                      <div class="cd-receipt-bracket bl"></div>
                      <div class="cd-receipt-bracket br"></div>
                      <div class="cd-scan-line" x-show="analyzing"></div>
                      <button class="remove-receipt" @click="removeReceipt" style="position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,0.7);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;">✕</button>
                      <div style="position:absolute;top:14px;left:14px;" x-show="analyzing">
                        <div class="cd-status-chip"><span class="cd-status-chip-dot"></span>ANALIZANDO</div>
                      </div>
                    </div>

                    <!-- Extracted data (shown after analysis) -->
                    <div x-show="analyzed && form.amount" style="margin-top:16px;">
                      <div class="cd-section-label">DATOS EXTRAÍDOS</div>
                      <div style="background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:4px 0;">
                        <div class="cd-extracted-row">
                          <div style="font-size:12px;color:var(--muted);">Total</div>
                          <div class="gradient-text" style="font-size:16px;font-weight:700;letter-spacing:-0.4px;font-variant-numeric:tabular-nums;" x-text="'$' + parseFloat(form.amount || 0).toFixed(2)"></div>
                        </div>
                        <div class="cd-extracted-row" x-show="form.description">
                          <div style="font-size:12px;color:var(--muted);">Comercio</div>
                          <div style="font-size:13px;font-weight:500;" x-text="form.description"></div>
                        </div>
                        <div class="cd-extracted-row">
                          <div style="font-size:12px;color:var(--muted);">Fecha</div>
                          <div style="font-size:13px;font-weight:500;" x-text="form.date"></div>
                        </div>
                        <div class="cd-extracted-row" x-show="form.category">
                          <div style="font-size:12px;color:var(--muted);">Categoría</div>
                          <template x-for="c in (form.is_income ? incomeCategories : categories)" :key="c.key">
                            <div x-show="c.key === form.category" style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;">
                              <span x-text="c.emoji"></span><span x-text="c.label"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <!-- ARCHIVO MODE — CD: dropzone + selected file + detected list -->
              <div x-show="inputMode === 'archivo' && !editingExpense" style="margin-bottom:18px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="16" height="16"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                  <div style="font-size:14px;font-weight:700;">Importar archivo</div>
                  <span class="plan-badge elite" style="font-size:9px;">ELITE</span>
                </div>

                <!-- Dropzone: no file yet -->
                <template x-if="!importedFile">
                  <label class="cd-dropzone">
                    <div class="cd-dropzone-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" width="24" height="24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <div style="font-size:14px;font-weight:700;text-align:center;">Sube un PDF, Excel o CSV</div>
                    <div style="font-size:11px;color:var(--muted);text-align:center;line-height:1.4;">Estado de cuenta, factura electrónica o exportación bancaria</div>
                    <div style="display:flex;gap:6px;margin-top:4px;">
                      <div class="cd-format-badge">PDF</div>
                      <div class="cd-format-badge">XLSX</div>
                      <div class="cd-format-badge">CSV</div>
                      <div class="cd-format-badge">XML</div>
                    </div>
                    <input type="file" accept=".pdf,.xlsx,.csv,.xml,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/xml" @change="handleFileImport($event)" style="display:none">
                  </label>
                </template>

                <!-- Selected file + detected list -->
                <template x-if="importedFile">
                  <div>
                    <div class="cd-section-label" style="margin-top:0;">ARCHIVO SELECCIONADO</div>
                    <div class="cd-selected-file">
                      <div class="cd-file-icon" x-text="importedFile.ext"></div>
                      <div style="flex:1;min-width:0;">
                        <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" x-text="importedFile.name"></div>
                        <div style="font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace;" x-text="importedFile.meta"></div>
                      </div>
                      <button @click="importedFile = null" style="background:none;border:none;cursor:pointer;padding:4px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                      </button>
                    </div>

                    <div x-show="importedFile && importedExpenses.length > 0" style="margin-top:14px;">
                      <div class="cd-section-label">GASTOS DETECTADOS · <span x-text="importedExpenses.length"></span></div>
                      <div style="background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:4px 14px;">
                        <template x-for="(e, ei) in importedExpenses.slice(0, 3)" :key="ei">
                          <div>
                            <div class="cd-detected-list-item">
                              <template x-for="c in categories" :key="c.key">
                                <div x-show="c.key === e.category" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;" :style="'background:' + c.color + '20;border:1px solid ' + c.color + '40'">
                                  <span x-text="c.emoji"></span>
                                </div>
                              </template>
                              <div style="flex:1;min-width:0;">
                                <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" x-text="e.description"></div>
                                <div style="font-size:11px;color:var(--muted);margin-top:2px;" x-text="e.date"></div>
                              </div>
                              <div style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);" x-text="'−$' + parseFloat(e.amount).toFixed(2)"></div>
                              <div style="width:18px;height:18px;border-radius:5px;background:var(--cyan);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0F" stroke-width="3.4" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>
                              </div>
                            </div>
                            <div x-show="ei < Math.min(importedExpenses.length, 3) - 1" style="height:1px;background:var(--border);"></div>
                          </div>
                        </template>
                        <div x-show="importedExpenses.length > 3" style="padding:10px 0;text-align:center;font-size:11px;color:var(--cyan);font-weight:600;border-top:1px solid var(--border);" x-text="'+' + (importedExpenses.length - 3) + ' gastos más · ver todos'"></div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <!-- AMOUNT BOX (gradient) -->
              <div class="amount-box">
                <div class="amount-label">MONTO DETECTADO</div>
                <div class="amount-row">
                  <span class="amount-dollar">$</span>
                  <div class="amount-value">
                    <input type="number" step="0.01" min="0" placeholder="0.00" x-model="form.amount" inputmode="decimal">
                  </div>
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" width="18" height="18" style="flex-shrink:0;margin-left:auto;"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </div>
                <div class="amount-hint">USD · toca para editar</div>
              </div>

              <!-- DESCRIPTION FIELD BOX (skip in texto mode — the describe card above is the editor) -->
              <div class="field-box" x-show="editingExpense || inputMode !== 'texto'">
                <div class="field-box-label">DESCRIPCIÓN</div>
                <div class="field-box-inner">
                  <textarea x-model="form.description" placeholder="almuerzo 15, taxi aeropuerto 8.50..." rows="2"></textarea>
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" width="16" height="16" style="flex-shrink:0;align-self:flex-start;margin-top:14px;"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </div>
              </div>

              <!-- CATEGORY — CD: dropdown 50px (current) + horizontal scroll of others -->
              <div style="margin-bottom:12px;">
                <div class="cd-section-label">CATEGORÍA</div>
                <!-- Current selected -->
                <div @click="catDropdownOpen = !catDropdownOpen" style="height:50px;border-radius:12px;background:var(--surface);border:1px solid var(--border);padding:0 14px;display:flex;align-items:center;gap:10px;cursor:pointer;">
                  <template x-if="form.category">
                    <template x-for="c in (form.is_income ? incomeCategories : categories)" :key="c.key">
                      <template x-if="c.key === form.category">
                        <div style="display:flex;align-items:center;gap:10px;flex:1;">
                          <div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;" :style="'background:' + c.color + '20;border:1px solid ' + c.color + '40'">
                            <span x-text="c.emoji"></span>
                          </div>
                          <div style="flex:1;font-size:15px;font-weight:500;" x-text="c.label"></div>
                        </div>
                      </template>
                    </template>
                  </template>
                  <template x-if="!form.category">
                    <div style="flex:1;font-size:14px;color:var(--dim);">Selecciona una categoría…</div>
                  </template>
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" width="16" height="16" :style="catDropdownOpen ? 'transform:rotate(180deg);transition:transform 0.2s' : 'transition:transform 0.2s'"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <!-- Horizontal scroll of other categories -->
                <div style="display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;">
                  <template x-for="c in (form.is_income ? incomeCategories : categories).filter(c => c.key !== form.category)" :key="c.key">
                    <button @click="form.category = c.key" style="padding:6px 10px;border-radius:8px;font-size:11px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;">
                      <span style="font-size:12px;" x-text="c.emoji"></span><span x-text="c.label"></span>
                    </button>
                  </template>
                </div>
                <!-- Expanded grid (when dropdown clicked) -->
                <div x-show="catDropdownOpen" style="margin-top:8px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-wrap:wrap;gap:6px;">
                  <template x-for="c in (form.is_income ? incomeCategories : categories)" :key="c.key">
                    <button @click="form.category = c.key; catDropdownOpen = false" :style="form.category === c.key ? 'border:1px solid ' + c.color + ';background:' + c.color + '15' : 'border:1px solid var(--border);background:var(--bg)'" style="padding:6px 10px;border-radius:8px;font-size:11px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;">
                      <span style="font-size:12px;" x-text="c.emoji"></span><span x-text="c.label"></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- DATE FIELD BOX -->
              <div class="field-box">
                <div class="field-box-label">FECHA</div>
                <div class="field-box-inner">
                  <input type="date" x-model="form.date" style="flex:1;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" width="16" height="16" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
              </div>

              <!-- INCOME TOGGLE -->
              <div class="field-box">
                <div class="field-box-inner" style="cursor:pointer;" @click="form.is_income = !form.is_income; form.category = ''">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" width="18" height="18" style="flex-shrink:0;"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                  <span style="flex:1;font-size:15px;font-weight:500;">Es un ingreso</span>
                  <div class="split-toggle" :style="form.is_income ? 'background:var(--success)' : 'background:var(--surface2);border:1px solid var(--border)'">
                    <div class="split-toggle-knob" :style="form.is_income ? 'left:18px' : 'left:2px'"></div>
                  </div>
                </div>
              </div>

              <!-- SPLIT SECTION — CD: multi-person with proportion bar -->
              <div :style="form.is_split ? 'background:rgba(0,240,255,0.03);border:1px solid var(--cyan);border-radius:14px;overflow:hidden;margin-bottom:12px' : 'background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px'">
                <div @click="toggleSplit()" style="padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;">
                  <div :style="form.is_split ? 'background:rgba(0,240,255,0.12)' : 'background:var(--bg)'" style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg viewBox="0 0 24 24" fill="none" :stroke="form.is_split ? 'var(--cyan)' : 'var(--muted)'" stroke-width="2" width="15" height="15"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  </div>
                  <div style="flex:1;">
                    <div style="font-size:14px;font-weight:600;">Dividir este gasto</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:2px;" x-text="form.is_split ? (form.split_people.length + ' personas') : 'Genera cobros automáticos'"></div>
                  </div>
                  <div style="width:38px;height:22px;border-radius:11px;position:relative;transition:background 0.2s;" :style="form.is_split ? 'background:var(--cyan)' : 'background:#2a2a3d'">
                    <div style="position:absolute;top:2px;width:18px;height:18px;border-radius:9px;background:#fff;transition:left 0.2s;" :style="form.is_split ? 'left:18px' : 'left:2px'"></div>
                  </div>
                </div>

                <template x-if="form.is_split">
                  <div style="padding:0 14px 14px;">
                    <!-- Multi-color proportion bar -->
                    <div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:12px;background:var(--border);">
                      <template x-for="p in form.split_people" :key="p.name + p.color">
                        <div :style="'width:' + p.pct + '%;background:' + p.color + ';transition:width 0.2s'"></div>
                      </template>
                    </div>

                    <!-- Person rows -->

          });

            await sb.from('users').upsert({

              name: this.authName || this.authEmail.split('@')[0],

              trial_start: new Date().toISOString(),
              trial_end: new Date(Date.now() + 7 * 86400000).toISOString(),

              accepted_at: new Date().toISOString(),
              created_at: new Date().toISOString()
            }, { onConflict: 'id' });
          }
        } else {

            email: this.authEmail,
            password: this.authPassword
          });

        }
      } catch (e) {

    async deleteAccount() {
      if (!confirm('¿Estás seguro? Se eliminarán TODOS tus datos (gastos, presupuestos, recibos). Esta acción no se puede deshacer.')) return;
      if (!confirm('Última confirmación: ¿Eliminar tu cuenta y todos tus datos permanentemente?')) return;
      try {

        await sb.from('users').delete().eq('id', uid);

    async loadHistory() {

      const end = new Date(this.histYear, this.histMonth + 1, 0).toLocaleDateString('en-CA');

    historyData: [],

    get historyExpenses() {
      if (this.filterCat === 'all') return this.historyData;
      return this.historyData.filter(e => e.category === this.filterCat);
    },

    get filteredHistoryGroups() {
      const groups = {};
      const today = localDate();
      const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
      this.historyExpenses.forEach(exp => {
        const d = exp.date;
        let label = d;
        if (d === today) label = 'HOY';
        else if (d === yesterday) label = 'AYER';
        else label = new Date(d + 'T12:00:00').toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });
        if (!groups[label]) groups[label] = { label, items: [], total: 0 };
        groups[label].items.push(exp);
        if (!exp.is_income) groups[label].total += exp.amount;
      });
      return Object.values(groups);
    },

    get historyTotal() {
      return this.historyExpenses.filter(e => !e.is_income).reduce((s, e) => s + e.amount, 0);
    },

    get historyMonthLabel() {
      return MONTH_NAMES[this.histMonth] + ' ' + this.histYear;
    },

    prevMonth() {
      if (this.histMonth === 0) { this.histMonth = 11; this.histYear--; }
      else this.histMonth--;
      this.loadHistory();
    },
    nextMonth() {
      if (this.histMonth === 11) { this.histMonth = 0; this.histYear++; }
      else this.histMonth++;
      this.loadHistory();
    },

    get currentMonthLabel() {
      const now = new Date();
      return MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();
    },

    get currentMonthStart() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), 1).toLocaleDateString('en-CA');
    },
    get monthExpenses() { return this.expenses.filter(e => !e.is_income && e.date >= this.currentMonthStart); },
    get monthTotal() { return this.monthExpenses.reduce((s, e) => s + e.amount, 0); },
    get monthIncome() { return this.expenses.filter(e => e.is_income && e.date >= this.currentMonthStart).reduce((s, e) => s + e.amount, 0); },
    get monthBalance() { return this.monthIncome - this.monthTotal; },

    get periodStart() {
      const now = new Date();
      if (this.dashPeriod === 'semana') {
        return new Date(now - 7 * 86400000).toLocaleDateString('en-CA');
      } else if (this.dashPeriod === 'año') {
        return new Date(now.getFullYear(), 0, 1).toLocaleDateString('en-CA');
      }
      return new Date(now.getFullYear(), now.getMonth(), 1).toLocaleDateString('en-CA');
    },
    get periodExpenses() {
      return this.expenses.filter(e => !e.is_income && e.date >= this.periodStart);
    },
    get periodTotal() { return this.periodExpenses.reduce((s, e) => s + e.amount, 0); },
    get periodIncome() {
      return this.expenses.filter(e => e.is_income && e.date >= this.periodStart).reduce((s, e) => s + e.amount, 0);
    },

      if (this.dashPeriod === 'semana') return 'Esta semana';
      if (this.dashPeriod === 'año') return 'Este año';

    get currentMonthName() { return MONTH_NAMES[new Date().getMonth()]; },

    get monthDelta() {
      const now = new Date();
      const prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1).toLocaleDateString('en-CA');
      const prevEnd = new Date(now.getFullYear(), now.getMonth(), 0).toLocaleDateString('en-CA');
      const prevTotal = this.expenses.filter(e => !e.is_income && e.date >= prevStart && e.date <= prevEnd).reduce((s, e) => s + e.amount, 0);
      return this.monthTotal - prevTotal;
    },

    get daysRemainingInMonth() {
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return Math.max(0, lastDay - now.getDate());
    },

    get monthPct() {
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return Math.round((now.getDate() / daysInMonth) * 100);
    },

    get spentPct() {
      const total = this.budgetTotalAmount;
      if (total <= 0) return Math.min(100, Math.round((this.monthTotal / Math.max(this.monthTotal, 1)) * 100));
      return Math.min(100, Math.round((this.monthTotal / total) * 100));
    },

    get weekTotal() {
      const now = new Date();
      const weekAgo = new Date(now - 7 * 86400000).toLocaleDateString('en-CA');
      return this.monthExpenses.filter(e => e.date >= weekAgo).reduce((s, e) => s + e.amount, 0);
    },

    get topCategory() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? CAT_MAP[sorted[0][0]]?.label || sorted[0][0] : '';
    },

    get topCategoryAmount() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? sorted[0][1] : 0;
    },

    get topCategoryEmoji() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? (CAT_MAP[sorted[0][0]]?.emoji || '✨') : '';
    },

    get topCategoryPct() {
      if (!this.monthTotal) return 0;
      return Math.round((this.topCategoryAmount / this.monthTotal) * 100);
    },

    get weekExpenseCount() {
      const now = new Date();
      const weekAgo = new Date(now - 7 * 86400000).toLocaleDateString('en-CA');
      return this.monthExpenses.filter(e => e.date >= weekAgo).length;
    },

    get budgetTotalAmount() {
      const total = this.budgets?.find(b => !b.category);
      if (total) return total.amount || 0;
      return this.budgets?.reduce((s, b) => s + (b.amount || 0), 0) || 0;
    },

    get budgetTotalPct() {
      if (!this.budgetTotalAmount) return 0;
      return Math.min(100, Math.round((this.monthTotal / this.budgetTotalAmount) * 100));
    },

    get recentExpenses() { return this.expenses.slice(0, 8); },

    // ── Voice Input ──
    toggleVoice() {
      if (this.voiceRecording) {
        if (this.voiceRecognition) this.voiceRecognition.stop();
        this.voiceRecording = false;
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return this.showToast('Tu navegador no soporta voz');
      const rec = new SR();
      rec.lang = 'es-EC';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        this.voiceTranscript = text;
        this.parseVoiceText(text);
        this.voiceRecording = false;
      };
      rec.onerror = () => { this.voiceRecording = false; this.showToast('No se pudo escuchar'); };
      rec.onend = () => { this.voiceRecording = false; };
      rec.start();
      this.voiceRecognition = rec;
      this.voiceRecording = true;
    },

    parseVoiceText(text) {
      const lower = text.toLowerCase();
      const numMatch = lower.match(/(\d+[\.,]?\d*)/);
      if (numMatch) this.form.amount = numMatch[1].replace(',', '.');
      this.form.description = text;
      const catMap = {
        food: ['comida','almuerzo','desayuno','cena','restaurante','pollo','arroz','menu'],
        transport: ['bus','transporte','gasolina','combustible','pasaje'],
        taxi: ['taxi','uber','cabify','indriver'],
        coffee: ['cafe','cappuccino','latte'],
        health: ['medicina','farmacia','doctor','hospital','salud','pastilla'],
        market: ['mercado','supermercado','megamaxi','supermaxi','tienda','compras del'],
        shop: ['ropa','zapato','amazon','compra','regalo'],
        rent: ['arriendo','alquiler','luz','agua','internet','servicios'],
        fun: ['cine','netflix','juego','spotify','entretenimiento','fiesta'],
      };
      for (const [key, words] of Object.entries(catMap)) {
        if (words.some(w => lower.includes(w))) { this.form.category = key; break; }
      }
      if (lower.includes('ingreso') || lower.includes('cobr') || lower.includes('recibi') || lower.includes('me pag')) {
        this.form.is_income = true;
      }
      this.showToast('Voz: "' + text.slice(0, 40) + '"');
    },

    // ── Photo Upload ──
    async handlePhoto(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      this.receiptFile = file;
      this.receiptPreview = URL.createObjectURL(file);

    handleFileImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const ext = (file.name.split('.').pop() || '').toUpperCase().slice(0, 4);
      const sizeKb = Math.round(file.size / 1024);
      const sizeStr = sizeKb >= 1024 ? (sizeKb / 1024).toFixed(1) + ' MB' : sizeKb + ' KB';
      this.importedFile = {
        name: file.name,
        ext: ext || 'FILE',
        meta: sizeStr,
        raw: file,
      };
      this.importedExpenses = [];
    },

    splitColorPalette: ['#00F0FF', '#7000FF', '#FFB800', '#FF6B6B', '#00E5A0', '#7FB8FF', '#FF8AC4', '#B794F6'],

    toggleSplit() {
      this.form.is_split = !this.form.is_split;
      if (this.form.is_split && (!this.form.split_people || this.form.split_people.length === 0)) {
        this.form.split_people = [
          { name: 'Tú', pct: 50, you: true, color: this.splitColorPalette[0] },
          { name: '', pct: 50, color: this.splitColorPalette[1] },
        ];
      }
    },

    addSplitPerson() {
      const used = this.form.split_people.map(p => p.color);
      const nextColor = this.splitColorPalette.find(c => !used.includes(c)) || '#888';
      const n = this.form.split_people.length;
      const equal = Math.floor(100 / (n + 1));
      this.form.split_people.forEach(p => p.pct = equal);
      this.form.split_people.push({ name: '', pct: 100 - equal * n, color: nextColor });
    },

    removeSplitPerson(idx) {
      if (this.form.split_people[idx]?.you) return;
      this.form.split_people.splice(idx, 1);
      if (this.form.split_people.length < 2) {
        this.form.is_split = false;
        this.form.split_people = [];
      }
    },

    splitEqual() {
      const n = this.form.split_people.length;
      if (n === 0) return;
      const base = Math.floor(100 / n);
      const remainder = 100 - base * n;
      this.form.split_people.forEach((p, i) => p.pct = base + (i === n - 1 ? remainder : 0));
    },

    onSplitPctChange() {
      this.form.split_people.forEach(p => {
        const v = parseFloat(p.pct);
        p.pct = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
      });
    },

    get splitSum() {
      if (!this.form.split_people || !this.form.split_people.length) return 0;
      return this.form.split_people.reduce((s, p) => s + (parseFloat(p.pct) || 0), 0);
    },

    async uploadReceipt(expenseId) {

      const ext = this.receiptFile.name.split('.').pop() || 'jpg';
      const path = `${this.user.id}/${expenseId}.${ext}`;
      const { error } = await sb.storage.from('receipts').upload(path, this.receiptFile, { upsert: true });
      if (error) { this.showToast('Error subiendo foto'); return null; }

    // ── Budgets ──
    async loadBudgets() {
      const now = new Date();
      const { data } = await sb.from('budgets')
        .select('*')
        .eq('user_id', this.user.id)
        .eq('month', now.getMonth() + 1)
        .eq('year', now.getFullYear());

      this.budgets.forEach(b => {
        this.budgetForm[b.category || '_total'] = b.amount;
      });
