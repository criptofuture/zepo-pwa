    dashPeriod: 'mes',
    histMonth: new Date().getMonth(),
    histYear: new Date().getFullYear(),
    form: { amount: '', description: '', category: '', date: '', is_income: false, is_split: false, split_persona: '', split_pct: '' },
    pendingSplits: [],
    inputMode: 'texto',
    voiceRecording: false,
    voiceRecognition: null,
    receiptFile: null,
    receiptPreview: null,
    budgets: [],
    budgetForm: {},
    budgetSheetOpen: false,
    savingBudget: false,
    userPlan: 'free',
    planExpiresAt: null,
    showDeleteModal: false,
    deleteConfirmText: '',
    pwForm: { current: '', newPw: '', confirm: '' },
    changingPw: false,
    checkoutPlan: 'pro',
    paymentLoading: false,
    paymentError: '',

    async init() {
      window.addEventListener('online', () => this.offline = false);
      window.addEventListener('offline', () => this.offline = true);
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); this.installPrompt = e; });

      this.$watch('tab', (val, old) => {
        if (!['settings','changepass','plans','checkout','pay-processing','pay-success','pay-failed','forgotpw'].includes(val)) this.prevTab = val;
      });

      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        this.user = session.user;
        this.userName = session.user.user_metadata?.name || session.user.email.split('@')[0];
        await this.ensureUserRow();
        await Promise.all([this.loadExpenses(), this.loadSplits(), this.loadBudgets(), this.loadUserPlan()]);
        this.handlePaymentReturn();
      }

      sb.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session) {
          this.user = session.user;
          this.userName = session.user.user_metadata?.name || session.user.email.split('@')[0];
          await this.ensureUserRow();
          this.loadExpenses();
          this.loadUserPlan();
        }
        if (event === 'SIGNED_OUT') {
          this.user = null;
          this.expenses = [];
        }
      });
    },

    async ensureUserRow() {
      if (!this.user) return;
      const { data } = await sb.from('users').select('id').eq('id', this.user.id).maybeSingle();
      if (!data) {
        await sb.from('users').upsert({
          id: this.user.id,
          telegram_chat_id: -Math.floor(Date.now() / 1000),
          name: this.user.user_metadata?.name || this.user.email.split('@')[0],
          email: this.user.email,
          plan: 'free',
          trial_start: new Date().toISOString(),
          trial_end: new Date(Date.now() + 7 * 86400000).toISOString(),
          accepted_privacy: true,
          accepted_at: new Date().toISOString(),
          created_at: new Date().toISOString()
        }, { onConflict: 'id' });
      }
    },

    async handleAuth() {
      this.authError = '';
      this.authLoading = true;
      try {
        if (this.authMode === 'signup') {
          const { data, error } = await sb.auth.signUp({
            email: this.authEmail,
            password: this.authPassword,
            options: { data: { name: this.authEmail.split('@')[0] } }
          });
          if (error) throw error;
          if (data.user) {
            await sb.from('users').upsert({
              id: data.user.id,
              telegram_chat_id: -Math.floor(Date.now() / 1000),
              name: this.authEmail.split('@')[0],
              email: this.authEmail,
              plan: 'free',
              trial_start: new Date().toISOString(),
              trial_end: new Date(Date.now() + 7 * 86400000).toISOString(),
              accepted_privacy: true,
              accepted_at: new Date().toISOString(),
              created_at: new Date().toISOString()
            }, { onConflict: 'id' });
          }
        } else {
          const { error } = await sb.auth.signInWithPassword({
            email: this.authEmail,
            password: this.authPassword
          });
          if (error) throw error;
        }
      } catch (e) {
        this.authError = e.message === 'Invalid login credentials'
          ? 'Email o contraseña incorrectos'
          : e.message || 'Error de autenticación';
      }
      this.authLoading = false;
    },

    async handleLogout() {
      await sb.auth.signOut();
      this.user = null;
      this.expenses = [];
      this.tab = 'home';
    },

    async deleteAccount() {
      if (!confirm('¿Estás seguro? Se eliminarán TODOS tus datos (gastos, presupuestos, recibos). Esta acción no se puede deshacer.')) return;
      if (!confirm('Última confirmación: ¿Eliminar tu cuenta y todos tus datos permanentemente?')) return;
      try {
        const uid = this.user.id;
        await sb.from('splits').delete().eq('user_id', uid);
        await sb.from('budgets').delete().eq('user_id', uid);
        await sb.from('expenses').delete().eq('user_id', uid);
        await sb.from('users').delete().eq('id', uid);
        const { data: files } = await sb.storage.from('receipts').list(uid);
        if (files?.length) {
          await sb.storage.from('receipts').remove(files.map(f => `${uid}/${f.name}`));
        }
        await sb.auth.signOut();
        this.user = null;
        this.expenses = [];
        this.tab = 'home';
        alert('Cuenta eliminada correctamente.');
      } catch (e) {
        alert('Error al eliminar cuenta: ' + e.message);
      }
    },

    async loadExpenses() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().slice(0, 10);
      const { data } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .gte('date', start)
        .lte('date', end)
        .order('date', { ascending: false })
        .order('created_at', { ascending: false });
      this.expenses = data || [];
      try { localStorage.setItem('zepo_cache', JSON.stringify(this.expenses)); } catch {}
    },

    async loadHistory() {
      const start = new Date(this.histYear, this.histMonth, 1).toISOString().slice(0, 10);
      const end = new Date(this.histYear, this.histMonth + 1, 0).toISOString().slice(0, 10);
      const { data } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .gte('date', start)
        .lte('date', end)
        .order('date', { ascending: false })
        .order('created_at', { ascending: false });
      this.historyData = data || [];
    },

    historyData: [],

    get historyExpenses() {
      if (this.filterCat === 'all') return this.historyData;
      return this.historyData.filter(e => e.category === this.filterCat);
    },

    get filteredHistoryGroups() {
      const groups = {};
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      this.historyExpenses.forEach(exp => {
        const d = exp.date;
        let label = d;
        if (d === today) label = 'HOY';
        else if (d === yesterday) label = 'AYER';
        else label = new Date(d + 'T12:00:00').toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });
        if (!groups[label]) groups[label] = { label, items: [], total: 0 };
        groups[label].items.push(exp);
        if (!exp.is_income) groups[label].total += exp.amount;
      });
      return Object.values(groups);
    },

    get historyTotal() {
      return this.historyExpenses.filter(e => !e.is_income).reduce((s, e) => s + e.amount, 0);
    },

    get historyMonthLabel() {
      return MONTH_NAMES[this.histMonth] + ' ' + this.histYear;
    },

    prevMonth() {
      if (this.histMonth === 0) { this.histMonth = 11; this.histYear--; }
      else this.histMonth--;
      this.loadHistory();
    },
    nextMonth() {
      if (this.histMonth === 11) { this.histMonth = 0; this.histYear++; }
      else this.histMonth++;
      this.loadHistory();
    },

    get currentMonthLabel() {
      const now = new Date();
      return MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();
    },

    get monthExpenses() { return this.expenses.filter(e => !e.is_income); },
    get monthTotal() { return this.monthExpenses.reduce((s, e) => s + e.amount, 0); },
    get monthIncome() { return this.expenses.filter(e => e.is_income).reduce((s, e) => s + e.amount, 0); },
    get monthBalance() { return this.monthIncome - this.monthTotal; },

    get periodStart() {
      const now = new Date();
      if (this.dashPeriod === 'semana') {
        return new Date(now - 7 * 86400000).toISOString().slice(0, 10);
      } else if (this.dashPeriod === 'año') {
        return new Date(now.getFullYear(), 0, 1).toISOString().slice(0, 10);
      }
      return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
    },
    get periodExpenses() {
      return this.expenses.filter(e => !e.is_income && e.date >= this.periodStart);
    },
    get periodTotal() { return this.periodExpenses.reduce((s, e) => s + e.amount, 0); },
    get periodIncome() {
      return this.expenses.filter(e => e.is_income && e.date >= this.periodStart).reduce((s, e) => s + e.amount, 0);
    },
    get periodLabel() {
      if (this.dashPeriod === 'semana') return 'Esta semana';
      if (this.dashPeriod === 'año') return 'Este año';
      return this.currentMonthLabel;
    },

    get currentMonthName() { return MONTH_NAMES[new Date().getMonth()]; },

    get monthDelta() {
      const now = new Date();
      const prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().slice(0, 10);
      const prevEnd = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().slice(0, 10);
      const prevTotal = this.expenses.filter(e => !e.is_income && e.date >= prevStart && e.date <= prevEnd).reduce((s, e) => s + e.amount, 0);
      return this.monthTotal - prevTotal;
    },

    get monthPct() {
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return Math.round((now.getDate() / daysInMonth) * 100);
    },

    get spentPct() {
      const budget = this.budgets?.reduce((s, b) => s + (b.amount || 0), 0) || 0;
      if (budget <= 0) return Math.min(100, Math.round((this.monthTotal / Math.max(this.monthTotal, 1)) * 100));
      return Math.min(100, Math.round((this.monthTotal / budget) * 100));
    },

    get weekTotal() {
      const now = new Date();
      const weekAgo = new Date(now - 7 * 86400000).toISOString().slice(0, 10);
      return this.monthExpenses.filter(e => e.date >= weekAgo).reduce((s, e) => s + e.amount, 0);
    },

    get topCategory() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? CAT_MAP[sorted[0][0]]?.label || sorted[0][0] : '';
    },

    get topCategoryAmount() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? sorted[0][1] : 0;
    },

    get topCategoryEmoji() {
      const totals = {};
      this.monthExpenses.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      return sorted.length ? (CAT_MAP[sorted[0][0]]?.emoji || '✨') : '';
    },

    get topCategoryPct() {
      if (!this.monthTotal) return 0;
      return Math.round((this.topCategoryAmount / this.monthTotal) * 100);
    },

    get weekExpenseCount() {
      const now = new Date();
      const weekAgo = new Date(now - 7 * 86400000).toISOString().slice(0, 10);
      return this.monthExpenses.filter(e => e.date >= weekAgo).length;
    },

    get budgetTotalAmount() {
      return this.budgets?.reduce((s, b) => s + (b.amount || 0), 0) || 0;
    },

    get budgetTotalPct() {
      if (!this.budgetTotalAmount) return 0;
      return Math.min(100, Math.round((this.monthTotal / this.budgetTotalAmount) * 100));
    },

    get recentExpenses() { return this.expenses.slice(0, 8); },

    // ── Voice Input ──
    toggleVoice() {
      if (this.voiceRecording) {
        if (this.voiceRecognition) this.voiceRecognition.stop();
        this.voiceRecording = false;
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return this.showToast('Tu navegador no soporta voz');
      const rec = new SR();
      rec.lang = 'es-EC';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript;
        this.parseVoiceText(text);
        this.voiceRecording = false;
      };
      rec.onerror = () => { this.voiceRecording = false; this.showToast('No se pudo escuchar'); };
      rec.onend = () => { this.voiceRecording = false; };
      rec.start();
      this.voiceRecognition = rec;
      this.voiceRecording = true;
    },

    parseVoiceText(text) {
      const lower = text.toLowerCase();
      const numMatch = lower.match(/(\d+[\.,]?\d*)/);
      if (numMatch) this.form.amount = numMatch[1].replace(',', '.');
      this.form.description = text;
      const catMap = {
        food: ['comida','almuerzo','desayuno','cena','restaurante','pollo','arroz','menu'],
        transport: ['bus','transporte','gasolina','combustible','pasaje'],
        taxi: ['taxi','uber','cabify','indriver'],
        coffee: ['cafe','cappuccino','latte'],
        health: ['medicina','farmacia','doctor','hospital','salud','pastilla'],
        market: ['mercado','supermercado','megamaxi','supermaxi','tienda','compras del'],
        shop: ['ropa','zapato','amazon','compra','regalo'],
        rent: ['arriendo','alquiler','luz','agua','internet','servicios'],
        fun: ['cine','netflix','juego','spotify','entretenimiento','fiesta'],
      };
      for (const [key, words] of Object.entries(catMap)) {
        if (words.some(w => lower.includes(w))) { this.form.category = key; break; }
      }
      if (lower.includes('ingreso') || lower.includes('cobr') || lower.includes('recibi') || lower.includes('me pag')) {
        this.form.is_income = true;
      }
      this.showToast('Voz: "' + text.slice(0, 40) + '"');
    },

    // ── Photo Upload ──
    async handlePhoto(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      this.receiptFile = file;
      this.receiptPreview = URL.createObjectURL(file);
    },

    removeReceipt() {
      this.receiptFile = null;
      if (this.receiptPreview) URL.revokeObjectURL(this.receiptPreview);
      this.receiptPreview = null;
    },

    async uploadReceipt(expenseId) {
      if (!this.receiptFile || !this.user) return null;
      const ext = this.receiptFile.name.split('.').pop() || 'jpg';
      const path = `${this.user.id}/${expenseId}.${ext}`;
      const { error } = await sb.storage.from('receipts').upload(path, this.receiptFile, { upsert: true });
      if (error) { this.showToast('Error subiendo foto'); return null; }
      this.removeReceipt();
      return path;
    },

    // ── Budgets ──
    async loadBudgets() {
      const now = new Date();
      const { data } = await sb.from('budgets')
        .select('*')
        .eq('user_id', this.user.id)
        .eq('month', now.getMonth() + 1)
        .eq('year', now.getFullYear());
      this.budgets = data || [];
      this.budgetForm = {};
      this.budgets.forEach(b => {
        this.budgetForm[b.category || '_total'] = b.amount;
      });
    },

    async saveBudgets() {
      this.savingBudget = true;
      const now = new Date();
      const month = now.getMonth() + 1;
      const year = now.getFullYear();
      try {
        await sb.from('budgets').delete()
          .eq('user_id', this.user.id)
          .eq('month', month)
          .eq('year', year);
        const rows = [];
        for (const [key, val] of Object.entries(this.budgetForm)) {
          if (!val || parseFloat(val) <= 0) continue;
          rows.push({
            user_id: this.user.id,
            category: key === '_total' ? null : key,
            amount: parseFloat(val),
            month, year
          });
        }
        if (rows.length > 0) {
          const { error } = await sb.from('budgets').insert(rows);
          if (error) throw error;
        }
        await this.loadBudgets();
        this.budgetSheetOpen = false;
        this.showToast('Presupuestos guardados');
      } catch (e) { this.showToast('Error: ' + e.message); }
      this.savingBudget = false;
    },

    get budgetBars() {
      return this.budgets.filter(b => b.category).map(b => {
        const spent = this.monthExpenses.filter(e => e.category === b.category).reduce((s, e) => s + e.amount, 0);
        const cat = CAT_MAP[b.category] || {};
        return { cat: b.category, label: cat.label || b.category, emoji: cat.emoji || '✨', color: cat.color || '#8888AA', budget: b.amount, spent, pct: Math.round(spent / b.amount * 100) };
      });
    },

    get budgetAlerts() {
      const alerts = [];
      this.budgetBars.forEach(b => {
        if (b.pct >= 80) alerts.push(b);
      });
      const totalBudget = this.budgets.find(b => !b.category);
      if (totalBudget) {
        const pct = Math.round(this.monthTotal / totalBudget.amount * 100);
        if (pct >= 80) alerts.push({ cat: '_total', label: 'Total mensual', pct, spent: this.monthTotal, budget: totalBudget.amount });
      }
      return alerts;
    },

    // ── Export Excel ──
    async exportExcel() {
      const { data } = await sb.from('expenses').select('*').eq('user_id', this.user.id).order('date', { ascending: false });
      if (!data || !data.length) return this.showToast('No hay datos');
      const header = ['Fecha','Categoría','Descripción','Monto','Tipo','Split','Persona','Pendiente'];
      const rows = data.map(e => [
        e.date, CAT_MAP[e.category]?.label || e.category, e.description || '',
        e.amount, e.is_income ? 'Ingreso' : 'Gasto',
        e.is_split ? 'Si' : 'No', e.split_persona || '', e.split_pending || 0
      ]);
      const xml = this.buildExcelXML(header, rows);
      const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zepo-gastos.xls';
      a.click();
      this.showToast('Excel descargado');
    },

    buildExcelXML(header, rows) {
      let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<?mso-application progid="Excel.Sheet"?>\n';
      xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
      xml += '<Worksheet ss:Name="Gastos"><Table>\n';
      xml += '<Row>' + header.map(h => `<Cell><Data ss:Type="String">${h}</Data></Cell>`).join('') + '</Row>\n';
      rows.forEach(r => {
        xml += '<Row>' + r.map((c, i) => {
          const type = (i === 3 || i === 7) ? 'Number' : 'String';
          return `<Cell><Data ss:Type="${type}">${c}</Data></Cell>`;
        }).join('') + '</Row>\n';
      });
      xml += '</Table></Worksheet></Workbook>';
      return xml;
    },

    openNew() {
      this.editingExpense = null;
      this.inputMode = 'texto';
      this.form = {
        amount: '',
        description: '',
        category: '',
        date: new Date().toISOString().slice(0, 10),
        is_income: false,
        is_split: false,
        split_persona: '',
        split_pct: ''
      };
      this.removeReceipt();
      this.sheetOpen = true;
    },

    openEdit(exp) {
      this.editingExpense = exp;
      this.form = {
        amount: exp.is_split ? exp.split_total : exp.amount,
        description: exp.description || '',
        category: exp.category,
        date: exp.date,
        is_income: exp.is_income || false,
        is_split: exp.is_split || false,
        split_persona: exp.split_persona || '',
        split_pct: exp.split_pct || ''
      };
      this.sheetOpen = true;
    },

    async saveExpense() {
      if (!this.form.amount) return this.showToast('Ingresa un monto');
      if (!this.form.category) return this.showToast('Selecciona una categoría');
      if (!this.form.date) this.form.date = new Date().toISOString().slice(0, 10);
      this.saving = true;
      try {
        const totalAmount = parseFloat(this.form.amount);
        const isSplit = !!(this.form.is_split && this.form.split_pct);
        const pct = isSplit ? parseFloat(this.form.split_pct) : 0;
        const miParte = isSplit ? Math.round(totalAmount * pct / 100 * 100) / 100 : totalAmount;
        const pendiente = isSplit ? Math.round((totalAmount - miParte) * 100) / 100 : 0;

        const payload = {
          user_id: this.user.id,
          amount: miParte,
          category: this.form.category,
          description: this.form.description,
          date: this.form.date,
          is_income: this.form.is_income,
          is_split: isSplit,
          split_total: isSplit ? totalAmount : null,
          split_pct: isSplit ? pct : null,
          split_persona: isSplit ? (this.form.split_persona || 'Sin nombre') : null,
          split_pending: isSplit ? pendiente : null,
          split_status: isSplit ? 'pendiente' : null
        };

        if (this.editingExpense) {
          const { error } = await sb.from('expenses')
            .update(payload)
            .eq('id', this.editingExpense.id);
          if (error) throw error;
          if (this.receiptFile) {
            const path = await this.uploadReceipt(this.editingExpense.id);
            if (path) await sb.from('expenses').update({ receipt_image_path: path }).eq('id', this.editingExpense.id);
          }
          this.showToast('Gasto actualizado');
        } else {
          const { data: inserted, error } = await sb.from('expenses')
            .insert(payload)
            .select('id')
            .single();
          if (error) throw error;
          if (this.receiptFile && inserted) {
            const path = await this.uploadReceipt(inserted.id);
            if (path) await sb.from('expenses').update({ receipt_image_path: path }).eq('id', inserted.id);
          }
          this.showToast(isSplit ? '💸 Split guardado' : 'Gasto agregado');
        }

        this.sheetOpen = false;
        await this.loadExpenses();
        if (isSplit) await this.loadSplits();
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
      this.saving = false;
    },

    async deleteExpense() {
      if (!this.editingExpense) return;
      try {
        const { error } = await sb.from('expenses')
          .delete()
          .eq('id', this.editingExpense.id);
        if (error) throw error;
        this.sheetOpen = false;
        this.showToast('Gasto eliminado');
        await this.loadExpenses();
        await this.loadSplits();
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
    },

    async loadSplits() {
      const { data } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .eq('is_split', true)
        .eq('split_status', 'pendiente')
        .order('date', { ascending: false });
      this.pendingSplits = data || [];
    },

    get knownPersonas() {
      const names = new Set();
      this.expenses.forEach(e => { if (e.split_persona) names.add(e.split_persona); });
      this.pendingSplits.forEach(e => { if (e.split_persona) names.add(e.split_persona); });
      return [...names].sort();
    },

    get splitsByPersona() {
      const groups = {};
      this.pendingSplits.forEach(e => {
        const name = e.split_persona || 'Sin nombre';
        if (!groups[name]) groups[name] = [];
        groups[name].push(e);
      });
      return groups;
    },

    get filteredSplitsByPersona() {
      const q = this.cobrosSearch.toLowerCase().trim();
      if (!q) return this.splitsByPersona;
      const filtered = {};
      Object.entries(this.splitsByPersona).forEach(([name, group]) => {
        if (name.toLowerCase().includes(q)) filtered[name] = group;
      });
      return filtered;
    },

    async markSplitPaid(id) {
      const { error } = await sb.from('expenses')
        .update({ split_status: 'cobrado', split_pending: 0 })
        .eq('id', id);
      if (error) return this.showToast('Error: ' + error.message);
      this.showToast('✅ Cobro registrado');
      await this.loadSplits();
    },

    async exportData() {
      const { data } = await sb.from('expenses')
        .select('*')
        .eq('user_id', this.user.id)
        .order('date', { ascending: false });
      if (!data || !data.length) return this.showToast('No hay datos');
      const csv = 'fecha,categoría,descripción,monto,tipo\n' + data.map(e =>
        `${e.date},${e.category},"${(e.description || '').replace(/"/g, '""')}",${e.amount},${e.is_income ? 'ingreso' : 'gasto'}`
      ).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zepo-gastos.csv';
      a.click();
      this.showToast('CSV descargado');
    },

    async installApp() {
      if (this.installPrompt) {
        this.installPrompt.prompt();
        this.installPrompt = null;
      }
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => this.toast = '', 2500);
    },

    fmtMoney(n) {
      return (n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    },

    getCatEmoji(key) { return CAT_MAP[key]?.emoji || '✨'; },
    getCatLabel(key) { return CAT_MAP[key]?.label || key; },
    getCatColor(key) { return CAT_MAP[key]?.color || '#8888AA'; },

    formatDate(d) {
      if (!d) return '';
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      if (d === today) return 'Hoy';
      if (d === yesterday) return 'Ayer';
      return new Date(d + 'T12:00:00').toLocaleDateString('es-EC', { day: 'numeric', month: 'short' });
    },

    formatTime(dt) {
      if (!dt) return '';
      return new Date(dt).toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
    },

    get todayLabel() {
      const d = new Date();
      const days = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
      return days[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTH_NAMES[d.getMonth()].toLowerCase();
    },

    get totalBudgetObj() {
      return this.budgets.find(b => !b.category) || null;
    },

    get totalBudgetPct() {
      if (!this.totalBudgetObj) return 0;
      return Math.round(this.monthTotal / this.totalBudgetObj.amount * 100);
    },

    get pwStrength() {
      const pw = this.pwForm.newPw || '';
      let score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 8) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      const labels = ['', 'DEBIL', 'REGULAR', 'FUERTE', 'MUY FUERTE'];
      const colors = ['', 'var(--danger)', 'var(--warning)', 'var(--success)', 'var(--success)'];
      return { level: score, label: labels[score] || '', color: colors[score] || '' };
    },

    async changePassword() {
      if (this.pwForm.newPw !== this.pwForm.confirm) return this.showToast('Las contraseñas no coinciden');
      if (this.pwForm.newPw.length < 6) return this.showToast('Minimo 6 caracteres');
      this.changingPw = true;
      try {
        const { error } = await sb.auth.updateUser({ password: this.pwForm.newPw });
        if (error) throw error;
        this.pwForm = { current: '', newPw: '', confirm: '' };
        this.showToast('Contraseña actualizada');
        this.tab = 'settings';
      } catch (e) {
        this.showToast('Error: ' + e.message);
      }
      this.changingPw = false;
    },

    async confirmDeleteAccount() {
      if (this.deleteConfirmText !== 'ELIMINAR') return;
      this.showDeleteModal = false;
      await this.deleteAccount();
    },

    async loadUserPlan() {
      if (!this.user) return;
      const { data } = await sb.from('users').select('plan, plan_expires_at').eq('id', this.user.id).maybeSingle();
      if (data) {
        this.userPlan = data.plan || 'free';
        this.planExpiresAt = data.plan_expires_at;
      }
    },

    get planOptions() {
      return [
        { key: 'free', label: 'FREE', price: '0', tagline: 'Empieza gratis', features: ['IA · texto basico', '10 gastos/mes', 'Moneda USD', 'Expira dic 2026'] },
        { key: 'pro', label: 'PRO', price: '5.00', tagline: 'Para uso personal serio', features: ['IA · texto + voz', 'Historial ilimitado', 'Multi-moneda LATAM', 'Exportar CSV/Excel', 'Presupuestos'] },
        { key: 'elite', label: 'ELITE', price: '10.00', tagline: 'Control total de tus finanzas', features: ['Todo de Pro', 'Foto de recibo · OCR', 'Importar PDF/CSV', 'Dashboard + analytics', 'Soporte prioritario'] },
      ];
    },

    get checkoutPrice() {
      return this.checkoutPlan === 'elite' ? '10.00' : '5.00';
    },

    startCheckout(plan) {
      this.checkoutPlan = plan;
      this.tab = 'checkout';
    },

    async initiatePayment() {
      this.paymentLoading = true;
      this.paymentError = '';
      try {
        const resp = await fetch(SUPABASE_URL + '/functions/v1/create-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (await sb.auth.getSession()).data.session.access_token,
          },
          body: JSON.stringify({ plan: this.checkoutPlan }),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || 'Error al crear pago');
        if (result.paymentUrl) {
          this.tab = 'pay-processing';
          window.location.href = result.paymentUrl;
        }
      } catch (e) {
        this.paymentError = e.message;
        this.tab = 'pay-failed';
      }
      this.paymentLoading = false;
    },

    async handlePaymentReturn() {
      const params = new URLSearchParams(window.location.search);
      const payId = params.get('id');
      const clientTxId = params.get('clientTransactionId');
      if (!payId || !clientTxId) return;
      this.tab = 'pay-processing';
      try {
        const resp = await fetch(SUPABASE_URL + '/functions/v1/confirm-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (await sb.auth.getSession()).data.session.access_token,
          },
          body: JSON.stringify({ id: parseInt(payId), clientTransactionId: clientTxId }),
        });
        const result = await resp.json();
        if (result.success) {
          this.userPlan = result.plan || this.checkoutPlan;
          this.tab = 'pay-success';
        } else {
          this.paymentError = result.error || 'Pago no confirmado';
          this.tab = 'pay-failed';
        }
      } catch (e) {
        this.paymentError = e.message;
        this.tab = 'pay-failed';
      }
      window.history.replaceState({}, '', window.location.pathname);
    },

    get weeklyChart() {
      const days = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
      const today = new Date();
      const result = [];
      let max = 1;
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().slice(0, 10);
        const total = this.monthExpenses.filter(e => e.date === dateStr).reduce((s, e) => s + e.amount, 0);
        if (total > max) max = total;
        result.push({ label: days[d.getDay()], total, isToday: i === 0 });
      }
      result.forEach(d => d.pct = Math.round(d.total / max * 100));
      return result;
    },

    get categoryBreakdown() {
      const totals = {};
      this.monthExpenses.forEach(e => {
        if (!totals[e.category]) totals[e.category] = 0;
        totals[e.category] += e.amount;
      });
      const total = this.monthTotal || 1;
      return Object.entries(totals)
        .sort((a, b) => b[1] - a[1])
        .map(([key, val]) => ({
          key, total: val,
          pct: Math.round(val / total * 100),
          label: CAT_MAP[key]?.label || key,
          emoji: CAT_MAP[key]?.emoji || '✨',
          color: CAT_MAP[key]?.color || '#8888AA',
        }));
    },
  };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
